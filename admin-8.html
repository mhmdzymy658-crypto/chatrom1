<!doctype html>
<html lang="fa" dir="rtl">
<head>

<title>پنل مدیریت | پرو چت v2</title>
<style>
:root{--bg:#050505;--p:#101010;--p2:#171717;--line:#2a2410;--gold:#d4af37;--gold2:#f5d77a;--gd:#8a6d12;--txt:#f3ead0;--mut:#9a9078;--ok:#2fd18b;--bad:#e5484d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:Tahoma,'Segoe UI',system-ui,sans-serif;min-height:100vh;line-height:1.6;padding-bottom:40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--txt);background:var(--p2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
.hidden{display:none!important}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 420px at 50% -10%,rgba(212,175,55,.18),transparent 65%);pointer-events:none}
#login{position:relative;max-width:380px;margin:12vh auto 0;padding:26px 20px;text-align:center}
#login h1{font-size:1.6rem;color:var(--gold2);margin-bottom:4px}
#login p{color:var(--mut);margin-bottom:18px}
#login input{margin-bottom:10px;text-align:center;direction:ltr}
.btn{display:inline-block;padding:11px 18px;border-radius:12px;background:linear-gradient(135deg,var(--gold2),var(--gold) 60%,var(--gd));color:#1a1400;font-weight:800}
.btn.ghost{background:var(--p2);color:var(--txt);border:1.5px solid var(--line);font-weight:600}
.btn.bad{background:rgba(229,72,77,.16);color:#ff7b80;border:1.5px solid rgba(229,72,77,.5)}
.btn.sm{padding:7px 12px;font-size:.82rem;border-radius:10px}
.btn:disabled{opacity:.5}
#err{color:#ff7b80;min-height:22px;margin:6px 0;font-size:.88rem;line-height:1.8}
#app{position:relative;max-width:900px;margin:0 auto}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(5,5,5,.92);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--gd)}
.top h2{flex:1;font-size:1.1rem;color:var(--gold2)}
.top small{color:var(--mut)}
.ibtn{width:40px;height:40px;border-radius:12px;background:var(--p2);border:1.5px solid var(--line);font-size:1.1rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;position:sticky;top:65px;z-index:19;background:rgba(5,5,5,.92)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;flex:none;padding:9px 14px;border-radius:999px;background:var(--p2);border:1.5px solid var(--line);color:var(--mut);font-size:.88rem;white-space:nowrap}
.tabs button.on{background:linear-gradient(135deg,var(--gold2),var(--gold) 60%,var(--gd));color:#1a1400;border-color:var(--gold);font-weight:800}
.tabs i{font-style:normal;margin-inline-start:6px;background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:.72rem}
#view{padding:6px 12px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{padding:14px;border-radius:18px;background:linear-gradient(145deg,#2b2208,var(--p2) 70%);border:1.5px solid var(--gd);text-align:center}
.stat b{display:block;font-size:1.7rem;color:var(--gold2)}.stat small{color:var(--mut)}
.card{padding:12px;border-radius:16px;background:var(--p2);border:1.5px solid var(--line);margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--p2);border:1.5px solid var(--line);margin-bottom:8px;width:100%;text-align:start}
.row:active{border-color:var(--gold)}
.av{width:42px;height:42px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--p);border:2px solid var(--gd);flex:none;font-weight:800}
.av img{width:100%;height:100%;object-fit:cover}
.nm{flex:1;min-width:0}.nm b{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.nm small{color:var(--mut);display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:#2b2208;border:1px solid var(--gd);color:var(--gold2);font-size:.74rem;margin-inline-start:4px}
.tag.r{background:rgba(229,72,77,.15);border-color:rgba(229,72,77,.5);color:#ff7b80}.tag.g{background:rgba(47,209,139,.13);border-color:rgba(47,209,139,.5);color:var(--ok)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
h3.sec{margin:16px 2px 8px;color:var(--gold2);font-size:.98rem}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
#mc{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--p);border:1.5px solid var(--gd);border-radius:24px 24px 0 0;padding:18px 16px 24px}
@media(min-width:700px){#modal{align-items:center}#mc{border-radius:24px}}
#mc h3{color:var(--gold2);margin-bottom:6px}
.field{margin:8px 0;text-align:start}.field label{display:block;color:var(--mut);font-size:.82rem;margin-bottom:4px}
.chat{max-height:46vh;overflow:auto;padding:8px;background:var(--bg);border-radius:14px;border:1.5px solid var(--line);margin:10px 0}
.msg{padding:7px 10px;border-radius:12px;background:var(--p2);margin-bottom:6px;font-size:.9rem;word-break:break-word}
.msg .h{display:flex;gap:6px;align-items:center;color:var(--gold2);font-size:.78rem;margin-bottom:2px}.msg .h button{margin-inline-start:auto;color:#ff7b80}
.msg.hl{border:1.5px solid var(--bad)}.msg.del{opacity:.45;font-style:italic}
.send{display:flex;gap:8px}.send input{flex:1}
.gg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:36vh;overflow:auto;margin:8px 0}
.gg button{padding:8px 2px;border-radius:12px;background:var(--p2);border:1.5px solid var(--line);font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:2px}.gg button span{font-size:1.5rem}.gg button.own{border-color:var(--ok)}
.sw{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;background:#2b2208;border:1.5px solid var(--gold);color:var(--gold2);padding:10px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.ph{display:flex;gap:12px;align-items:center}.ph img{width:84px;height:84px;object-fit:cover;border-radius:14px;border:2px solid var(--gd)}
.gall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.gcell{display:flex;flex-direction:column;gap:6px;padding:8px}
.gcell canvas{width:100%;aspect-ratio:1/1;border-radius:12px;background:#fbf4e2}

.xe-t{font-weight:800;color:var(--gold2);margin:12px 2px 8px}
.xe-board{max-width:460px;margin:0 auto;background:#1f4a35;border:3px solid #8a5a22;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.xe-board canvas{display:block;width:100%;aspect-ratio:1/1;touch-action:none;cursor:crosshair}
.xe-chs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0}
.xe-c{width:34px;height:34px;border-radius:50%;background:var(--c,#444);border:3px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:1rem;padding:0}
.xe-c.er{background:#555}.xe-c.on{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
.xe-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.xe-s{width:40px;height:40px;border-radius:50%;background:var(--p2);border:2px solid var(--line);display:grid;place-items:center;padding:0}
.xe-s i{display:block;border-radius:50%;background:#fff}.xe-s.on{border-color:var(--gold)}
.xe-o{display:flex;align-items:center;gap:8px;margin-bottom:8px;max-width:460px;margin-inline:auto}
.xe-o input[type=radio]{width:22px;height:22px;accent-color:var(--gold);flex:none;padding:0}
.xe-o .xe-in{flex:1;min-width:0}
.xe-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.xe-a{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:16px;background:var(--p2);border:1.5px solid var(--line)}
.xe-th{width:100%;aspect-ratio:1/1;border-radius:12px;background:#1f4a35}
.xe-a small{color:var(--mut);line-height:1.8}.xe-a em{color:#ff7b80;font-style:normal;font-size:.78rem}

.bdg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.bdg{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:16px;border:2px solid var(--bc);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--bc) 30%,#0b0b10),#0b0b10 75%);color:#fff;font:inherit;cursor:default;box-shadow:0 0 12px color-mix(in srgb,var(--bc) 55%,transparent),inset 0 0 14px color-mix(in srgb,var(--bc) 25%,transparent)}
.bdg-em{font-style:normal;font-size:2.1rem;line-height:1;filter:drop-shadow(0 0 8px var(--bc))}
.bdg-n{font-size:.66rem;font-weight:700;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--bc) 35%,#000);border:1px solid var(--bc);white-space:nowrap}
.bdg.lock{filter:grayscale(1) brightness(.55);box-shadow:none;border-color:#444}
.bdg.lock .bdg-em{filter:none;opacity:.6}
.bdg.own{cursor:pointer}
.bdg.on::after{content:'✓';position:absolute;top:4px;inset-inline-start:6px;font-size:.75rem;color:var(--bc)}
.bdg.on{outline:2px solid #fff4;outline-offset:2px}
.pf-bdg{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:3;font-size:1.7rem;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:#000a;border:2px solid var(--bc);box-shadow:0 0 14px var(--bc);filter:none}
.pf-bdgs{display:flex;justify-content:center;gap:5px;margin:4px 0;flex-wrap:wrap}
.pf-bdgs i{font-style:normal;font-size:1rem;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:#0009;border:1.5px solid var(--bc);box-shadow:0 0 8px var(--bc)}
.bdg-adm .bdg{cursor:pointer}
</style>
</head>
<body>
<div id="boot" style="text-align:center;padding:40vh 20px 0;color:var(--mut)">در حال بارگذاری…</div>

<div id="login" class="hidden">

<script type="module">
/* ====== اتصال به Supabase (همان بک‌اند بازی) ====== */
const SUPABASE_URL = 'https://pcvcaajarrlhfakdykah.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjdmNhYWphcnJsaGZha2R5a2FoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDI5NjcsImV4cCI6MjEwNzkxODk2N30.kkg60Cqq9BhhPBdw2KN9uqPf0uvsJY7I5kY25Q5DOAE';

function __makeShim(supa) {
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const autoId = () => { const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', a = new Uint8Array(20); crypto.getRandomValues(a); return Array.from(a, x => c[x % 62]).join(''); };
  const parentOf = p => p.replace(/\/[^/]+$/, '');

  /* ---------- خطاها ---------- */
  const fsErr = e => {
    if (e && e.__fs) return e;
    const msg = String(e?.message || e || ''), code = e?.code;
    let c = 'unknown';
    if (msg.includes('fs_conflict') || code === '40001' || code === '40P01') c = 'aborted';
    else if (msg.includes('fs_not_found') || code === 'P0002') c = 'not-found';
    else if (code === '42501' || /row-level security|permission denied|forbidden/i.test(msg)) c = 'permission-denied';
    else if (/fetch|network|timeout/i.test(msg) || e?.name === 'TypeError') c = 'unavailable';
    return Object.assign(new Error(msg || c), { code: c, __fs: true });
  };

  /* ---------- مقدارها ---------- */
  class Timestamp {
    constructor(ms) { this._ms = ms; }
    toMillis() { return this._ms; } toDate() { return new Date(this._ms); }
    get seconds() { return Math.floor(this._ms / 1000); } get nanoseconds() { return (this._ms % 1000) * 1e6; }
    valueOf() { return this._ms; }
    static now() { return new Timestamp(Date.now()); } static fromMillis(m) { return new Timestamp(m); } static fromDate(d) { return new Timestamp(d.getTime()); }
  }
  class Sentinel { constructor(j) { this.j = j; } }
  class FieldPath { constructor(...s) { this.s = s.map(String); } }
  const enc = v => {
    if (v === undefined) return undefined;
    if (v instanceof Sentinel) return v.j;
    if (v instanceof Timestamp) return { __t: v._ms };
    if (v instanceof Date) return { __t: v.getTime() };
    if (Array.isArray(v)) return v.map(x => { const y = enc(x); return y === undefined ? null : y; });
    if (v && typeof v === 'object') { const o = {}; for (const k of Object.keys(v)) { const x = enc(v[k]); if (x !== undefined) o[k] = x; } return o; }
    return v;
  };
  const dec = v => {
    if (Array.isArray(v)) return v.map(dec);
    if (v && typeof v === 'object') {
      if (typeof v.__t === 'number' && Object.keys(v).length === 1) return new Timestamp(v.__t);
      const o = {}; for (const k of Object.keys(v)) o[k] = dec(v[k]); return o;
    }
    return v;
  };
  const serverTimestamp = () => new Sentinel({ __op: 'ts' });
  const increment = n => new Sentinel({ __op: 'inc', n });
  const deleteField = () => new Sentinel({ __op: 'del' });
  const arrayUnion = (...v) => new Sentinel({ __op: 'union', v: v.map(enc) });
  const arrayRemove = (...v) => new Sentinel({ __op: 'rm', v: v.map(enc) });

  /* ---------- ارجاع‌ها و کوئری ---------- */
  class DocRef { constructor(path) { this.path = path; this.parent = parentOf(path); this.id = path.slice(path.lastIndexOf('/') + 1); this.type = 'document'; } }
  class ColRef { constructor(path) { this.path = path; this.id = path.slice(path.lastIndexOf('/') + 1); this.type = 'collection'; } }
  const collection = (_db, ...p) => new ColRef(p.join('/'));
  const doc = (base, ...p) => base instanceof ColRef ? new DocRef(base.path + '/' + (p.length ? p.join('/') : autoId())) : new DocRef(p.join('/'));
  const where = (f, op, v) => ({ t: 'where', f, op, v });
  const orderBy = (f, d = 'asc') => ({ t: 'order', f, d });
  const limitToLast = n => ({ t: 'last', n });
  const limit = n => ({ t: 'first', n });
  const query = (col, ...cons) => {
    const q = { isQuery: true, col, conds: [], order: null, desc: false, n: null, last: false };
    for (const c of cons) {
      if (c.t === 'where') q.conds.push(c);
      else if (c.t === 'order') { q.order = c.f; q.desc = c.d === 'desc'; }
      else if (c.t === 'last') { q.n = c.n; q.last = true; }
      else if (c.t === 'first') { q.n = c.n; q.last = false; }
    }
    return q;
  };
  const asQuery = x => x.isQuery ? x : query(x);
  const whereJson = q => {
    const o = {};
    for (const c of q.conds) {
      const v = enc(c.v);
      if (c.op === '==') o[c.f] = v; else if (c.op === 'array-contains') o[c.f] = [v];
      else throw fsErr(new Error('unsupported where operator: ' + c.op));
    }
    return o;
  };
  const jeq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const matches = (data, q) => q.conds.every(c => { const x = data?.[c.f], v = enc(c.v); return c.op === '==' ? jeq(x, v) : Array.isArray(x) && x.some(y => jeq(y, v)); });
  const skey = (d, f) => { const x = d?.[f]; return typeof x === 'number' ? x : (x && typeof x === 'object' && typeof x.__t === 'number') ? x.__t : null; };
  const cmpOf = q => (a, b) => {
    if (q.order) {
      const x = skey(a.data, q.order), y = skey(b.data, q.order);
      if (x !== y) { if (x === null) return q.desc ? -1 : 1; if (y === null) return q.desc ? 1 : -1; return q.desc ? y - x : x - y; }
    }
    return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
  };
  const viewOf = L => {
    let a = [...L.state.values()];
    if (!L.isDoc) { a.sort(cmpOf(L.q)); if (L.q.n != null) a = L.q.last ? a.slice(-L.q.n) : a.slice(0, L.q.n); }
    return a;
  };

  /* ---------- اسنپ‌شات‌ها ---------- */
  class DocSnap {
    constructor(path, data, exists, rev) { this.ref = new DocRef(path); this.id = this.ref.id; this._d = data; this._e = exists; this.rev = rev; this.metadata = { fromCache: false, hasPendingWrites: false }; }
    exists() { return this._e; }
    data() { return this._e ? dec(this._d) : undefined; }
    get(f) { return this.data()?.[f]; }
  }
  class QuerySnap {
    constructor(entries, changes) {
      this.docs = entries.map(e => new DocSnap(e.path, e.data, true, e.rev));
      this.size = this.docs.length; this.empty = !this.size;
      this._c = changes || this.docs.map((d, i) => ({ type: 'added', doc: d, oldIndex: -1, newIndex: i }));
      this.metadata = { fromCache: false, hasPendingWrites: false };
    }
    forEach(f, t) { this.docs.forEach(f, t); }
    docChanges() { return this._c; }
  }

  /* ---------- خواندن ---------- */
  async function fetchRow(path) {
    const { data, error } = await supa.from('docs').select('path,id,data,rev').eq('path', path).maybeSingle();
    if (error) throw fsErr(error);
    return data;
  }
  async function fetchQuery(q) {
    const { data, error } = await supa.rpc('fs_query', { p_parent: q.col.path, p_where: whereJson(q), p_order: q.order, p_desc: q.last ? !q.desc : q.desc, p_limit: q.n });
    if (error) throw fsErr(error);
    const rows = data || [];
    return q.last ? rows.slice().reverse() : rows;
  }
  const getDoc = async ref => { const r = await fetchRow(ref.path); return new DocSnap(ref.path, r?.data, !!r, r ? Number(r.rev) : 0); };
  const getDocs = async target => { const q = asQuery(target), rows = await fetchQuery(q); return new QuerySnap(rows.map(r => ({ path: r.path, id: r.id, data: r.data, rev: Number(r.rev) }))); };

  /* ---------- نوشتن ---------- */
  async function commit(ops, checks = []) {
    const { data, error } = await supa.rpc('fs_commit', { p_ops: ops, p_checks: checks });
    if (error) throw fsErr(error);
    (data || []).forEach(r => {
      if (r.deleted) dispatch({ path: r.path, parent: r.parent, id: r.id, deleted: true });
      else if (r.data) dispatch({ path: r.path, parent: r.parent, id: r.id, data: r.data, rev: Number(r.rev) });
    });
    return data;
  }
  const opSet = (ref, data, o) => ({ k: 'set', path: ref.path, data: enc(data), merge: !!(o && (o.merge || o.mergeFields)) });
  const toFields = args => {
    const out = [];
    if (args.length === 1 && args[0] && typeof args[0] === 'object' && !(args[0] instanceof FieldPath)) {
      for (const k of Object.keys(args[0])) { const v = enc(args[0][k]); if (v !== undefined) out.push({ p: k.split('.'), v }); }
    } else for (let i = 0; i < args.length; i += 2) {
      const v = enc(args[i + 1]); if (v !== undefined) out.push({ p: args[i] instanceof FieldPath ? args[i].s : String(args[i]).split('.'), v });
    }
    return out;
  };
  const opUpdate = (ref, args) => ({ k: 'update', path: ref.path, fields: toFields(args) });
  const opDelete = ref => ({ k: 'delete', path: ref.path });
  const setDoc = async (ref, data, o) => { await commit([opSet(ref, data, o)]); };
  const updateDoc = async (ref, ...args) => { await commit([opUpdate(ref, args)]); };
  const deleteDoc = async ref => { await commit([opDelete(ref)]); };
  const addDoc = async (col, data) => { const ref = new DocRef(col.path + '/' + autoId()); await commit([opSet(ref, data)]); return ref; };
  const writeBatch = () => {
    const ops = [];
    const b = {

const S = { pics: {}, mlog: [], users: {}, rooms: {}, market: [], reports: [], sugg: [], quests: [], museum: [], bot: { on: true, filter: true, autoMute: true, welcome: true, words: [], replies: [] }, ready: {} };
let warned = false;
const fail = e => { console.error(e); if (!warned) { warned = true; toast('خواندن داده ناموفق بود؛ سیاست‌های دسترسی (RLS) دیتابیس Supabase را اجرا کرده‌ای؟'); } };
function listen() {
  const L = [], mark = k => { S.ready[k] = true; render(); };
  L.push(onSnapshot(collection(db, 'users'), sn => { S.users = {}; sn.forEach(d => { S.users[d.id] = { uid: d.id, ...d.data() }; }); mark('users'); }, fail));
  L.push(onSnapshot(query(collection(db, 'rooms'), where('type', '==', 'group')), sn => { S.rooms = {}; sn.forEach(d => { S.rooms[d.id] = { id: d.id, ...d.data() }; }); mark('rooms'); }, fail));
  L.push(onSnapshot(collection(db, 'market'), sn => { S.market = sn.docs.map(d => ({ id: d.id, ...d.data() })); mark('market'); }, fail));
  L.push(onSnapshot(collection(db, 'reports'), sn => { S.reports = sn.docs.map(d => ({ id: d.id, ...d.data() })); mark('reports'); }, fail));
  L.push(onSnapshot(collection(db, 'suggestions'), sn => { S.sugg = sn.docs.map(d => ({ id: d.id, ...d.data() })); mark('sugg'); }, fail));
  L.push(onSnapshot(collection(db, 'museum'), sn => { S.museum = sn.docs.map(d => ({ id: d.id, ...d.data() })); mark('museum'); }, fail));
  L.push(onSnapshot(collection(db, 'questions'), sn => { S.quests = sn.docs.map(d => ({ id: d.id, ...d.data() })); mark('quests'); }, fail));
  ['public', 'channel'].forEach(k => L.push(onSnapshot(doc(db, 'rooms', k), sn => { S.pics[k] = sn.exists() ? (sn.data().photo || '') : ''; mark('pic_' + k); }, fail)));
  L.push(onSnapshot(doc(db, 'settings', 'bot'), sn => { S.bot = { on: true, filter: true, autoMute: true, welcome: true, words: [], replies: [], ...(sn.exists() ? sn.data() : {}) }; mark('bot'); }, fail));
  loadModLog();
  const ch = supa.channel('modlog-' + Date.now()).on('postgres_changes', { event: '*', schema: 'public', table: 'mod_log' }, () => loadModLog()).subscribe(), iv = setInterval(loadModLog, 30000);
  L.push(() => { clearInterval(iv); try { supa.removeChannel(ch); } catch (e) { /* بی‌صدا */ } });
  return () => L.forEach(f => f());
}
async function loadModLog() {
  try {
    const { data, error } = await supa.from('mod_log').select('*').order('at', { ascending: false }).limit(200);
    if (error) throw error; S.mlog = data || []; S.ready.mlog = true; render();
  } catch (e) { if (!S.ready.mlogErr) { S.ready.mlogErr = true; toast('گزارش ناظرها خوانده نشد؛ فایل mod-update.sql رو اجرا کردی؟'); } }
}

/* ====== کاربران ====== */
function deviceGroups() {
  const map = {};
  Object.values(S.users).forEach(u => {
    const d = u.deviceId || '';
    if (!d) return;
    (map[d] || (map[d] = [])).push(u);
  });
  return map;
}
function deviceMates(u) {
  if (!u?.deviceId) return [];
  return (deviceGroups()[u.deviceId] || []).filter(x => x.uid !== u.uid);
}
function usersView(v) {
  const q = (uq || '').toLowerCase().replace(/^@/, '');
  const filt = window.__uf || 'all';
  const groups = deviceGroups();
  const multiDevs = Object.entries(groups).filter(([, arr]) => arr.length >= 2)
    .sort((a, b) => b[1].length - a[1].length);
  let list = Object.values(S.users);
  if (filt === 'online') list = list.filter(isOnline);
  else if (filt === 'banned') list = list.filter(u => u.banned || u.banPerm);
  else if (filt === 'vip') list = list.filter(u => u.vip);
  else if (filt === 'mod') list = list.filter(u => u.mod);
  else if (filt === 'multi') list = list.filter(u => u.deviceId && (groups[u.deviceId] || []).length >= 2);
  if (q) list = list.filter(u => (u.name || '').toLowerCase().includes(q) || (u.handle || '').toLowerCase().includes(q) || (u.uid || '').toLowerCase().includes(q) || (u.deviceId || '').toLowerCase().includes(q));
  list = list.sort((a, b) => {
    const ma = (groups[a.deviceId] || []).length, mb = (groups[b.deviceId] || []).length;
    return (mb >= 2) - (ma >= 2) || mb - ma || (b.vip ? 1 : 0) - (a.vip ? 1 : 0) || (a.name || '').localeCompare(b.name || '', 'fa');
  }).slice(0, 200);
  const total = Object.keys(S.users).length;
  const tabs = [['all','همه'],['multi','۲ اکانت 📱'],['online','آنلاین'],['vip','VIP'],['mod','ناظر'],['banned','مسدود']];
  const multiBox = multiDevs.length ? `<div class="card" style="margin-bottom:12px;border-color:rgba(229,72,77,.45)">
    <b style="color:#ff7b80">📱 دستگاه‌های چنداکانتی (${fa(multiDevs.length)})</b>

    ${multiDevs.slice(0, 40).map(([did, arr]) => {
      const names = arr.map(u => `<button class="btn sm ghost" data-u="${u.uid}" style="margin:2px">${esc(u.name || '؟')} <small>@${esc(u.handle || '')}</small></button>`).join(' ');
      return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><small style="color:var(--mut);font-family:monospace;direction:ltr">${esc(did.slice(0, 18))}… • ${fa(arr.length)} اکانت</small><div class="btns" style="margin-top:6px">${names}</div></div>`;
    }).join('')}
  </div>` : `<div class="card" style="margin-bottom:12px"><small style="color:var(--mut)">هنوز دستگاهی با ۲ اکانت ثبت نشده (بعد از آپدیت ۱.۶۵.۱ پر می‌شود).</small></div>`;
  v.innerHTML = `<div class="field"><input id="uSearch" placeholder="جستجوی نام / آیدی / دستگاه  (${fa(total)} کاربر)" value="${esc(uq || '')}"></div>
    <div class="btns" id="uFilt" style="margin-bottom:10px">${tabs.map(([k,l]) => `<button class="btn sm ${filt===k?'':'ghost'}" data-uf="${k}">${l}</button>`).join('')}</div>
    ${filt === 'multi' || filt === 'all' ? multiBox : ''}
    <p style="color:var(--mut);font-size:.82rem;margin:0 0 8px">${fa(list.length)} نتیجه</p>` +
    (list.map(u => {
      const mates = deviceMates(u);
      const tags = [
        u.handle === 'hakem' ? '<span class="tag">سازنده</span>' : '',
        u.vip ? '<span class="tag">VIP</span>' : '',
        u.mod ? '<span class="tag g">ناظر</span>' : '',

        isMuted(u) ? '<span class="tag r">ساکت</span>' : '',
        isOnline(u) ? '<span class="tag g">آنلاین</span>' : '',
        mates.length ? `<span class="tag r">📱 ${fa(mates.length + 1)} اکانت</span>` : ''
      ].filter(Boolean).join('');
      const mateLine = mates.length
        ? `<small style="color:#ff9a9e">هم‌دستگاه: ${mates.map(m => esc(m.name || m.handle || '؟')).join('، ')}</small>`

async function revertDeal(lid) {
  await runTransaction(db, async tx => {
    const lref = doc(db, 'market', lid), l = (await tx.get(lref)).data();
    if (!l || l.status !== 'sold') throw new Error('این معامله قابل لغو نیست');
    const bref = doc(db, 'users', l.buyer), sref = doc(db, 'users', l.seller), b = (await tx.get(bref)).data();
    if (!(b.inventory || []).includes(l.card)) throw new Error('خریدار دیگر این کارت را ندارد');
    const it = ITEMS.find(i => i.id === l.card);
    tx.update(lref, { status: 'reverted', paid: true });
    tx.update(bref, { inventory: arrayRemove(l.card), ['invMeta.' + l.card]: deleteField(), spent: increment(-l.price), charms: (b.charms || []).filter(e => !it || e !== it.e) });
    const su = { inventory: arrayUnion(l.card) }; if (l.meta) su['invMeta.' + l.card] = l.meta;
    if (l.paid) su.gin = increment(-Math.floor(l.price * 0.95));
    tx.update(sref, su);
  });
}

const GCOL = ['#1d1d1f', '#e5484d', '#f08c00', '#f2c230', '#2fb344', '#1c7ed6', '#7048e8', '#d6336c', '#8d5a2b', '#8e8e93'], GW = [5, 10, 17, 30];

async function adminShrink(f, max = 256, q = .82) {
  const url = URL.createObjectURL(f);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}

/* ====== نقاشی‌های «حذفی»: نقاشی بکش ← ۶ گزینه بگذار ← ارسال ====== */
const XCOL = ['#f7f5ee', '#ff6b6b', '#ffa94d', '#ffe066', '#69db7c', '#74c0fc', '#b197fc', '#faa2c1', '#d2a679', '#ced4da'], XW = [5, 10, 17, 30];

function xPaint(cv, op, st) {

  for (; i < p.length; i += 2) ctx.lineTo(p[i] * k, p[i + 1] * k);
  ctx.stroke(); ctx.restore(); st.last = [p[p.length - 2], p[p.length - 1]];
}

function xeRedraw() {
  const cv = $('xeCv'); if (!cv) return; cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
  XE.strokes.forEach(st => xPaint(cv, { n: true, c: st.c, w: st.w, p: st.p }, { last: null }));
}
function xeInit() {
  const cv = $('xeCv'); if (!cv) return;
  const r0 = cv.getBoundingClientRect(); cv.width = cv.height = Math.max(520, Math.round(r0.width * Math.min(window.devicePixelRatio || 1, 2)));
  let st = { last: null }, lastP = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.round(Math.min(1000, Math.max(0, (e.clientX - r.left) / r.width * 1000))), Math.round(Math.min(1000, Math.max(0, (e.clientY - r.top) / r.height * 1000)))]; };

    e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) { /* بی‌صدا */ }

    xPaint(cv, { n: true, c: XE.color, w: XE.size, p: [p[0], p[1]] }, st);

    for (const ev of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e])) {
      const p = pos(ev); if (lastP && Math.hypot(p[0] - lastP[0], p[1] - lastP[1]) < 4) continue;
      if (XE.cur.p.length >= 1900) break;
      XE.cur.p.push(p[0], p[1]); lastP = p; xPaint(cv, { n: false, c: XE.color, w: XE.size, p: [p[0], p[1]] }, st);
    }
  };
  const up = () => { if (!XE.down) return; XE.down = false; if (XE.cur) XE.strokes.push(XE.cur); XE.cur = null; };
  cv.onpointerup = up; cv.onpointercancel = up;
}
const xeErr = e => { const m = String(e?.message || e || ''); return /not_admin/.test(m) ? 'سرور این حساب را مدیر نمی‌شناسد' : /bad_options/.test(m) ? 'گزینه‌ها باید ۶ تا، پرشده و غیرتکراری باشند' : /bad_art/.test(m) ? 'نقاشی نامعتبر است' : /Could not find the function|does not exist/.test(m) ? 'فایل SQL «elim_admin.sql» هنوز اجرا نشده' : (m || 'انجام نشد'); };
async function xeLoad() {
  const box = $('xeList'); if (!box || XE.busy) return; XE.busy = true;
  try {
    const { data, error } = await supa.rpc('dx_art_list'); if (error) throw error;
    XE.arts = data || [];
    const cnt = $('xeCnt'); if (cnt) cnt.textContent = `(${fa(XE.arts.length)})`;
    box.innerHTML = XE.arts.length ? XE.arts.map(a => `<div class="xe-a"><canvas class="xe-th" width="240" height="240" data-th="${a.id}"></canvas><b>${esc(a.word)}</b><small>${a.options.map((o, i) => (i === a.correct ? '✅ ' : '') + esc(o)).join(' • ')}</small>${a.rep ? `<em>🚩 ${fa(a.rep)} گزارش</em>` : ''}<div class="btns" style="margin-top:2px"><button class="btn sm bad" data-xdel="${a.id}">🗑 حذف</button></div></div>`).join('')
      : '<p class="empty">هنوز نقاشی‌ای ثبت نشده؛ اولین را بکش 🎨</p>';
    box.querySelectorAll('canvas[data-th]').forEach(cv => { const a = XE.arts.find(x => x.id === cv.dataset.th), st = { last: null }; (a?.ops || []).forEach(op => xPaint(cv, op, st)); });
  } catch (e) {
    XE.arts = [];
    box.innerHTML = `<p class="empty">${esc(xeErr(e))}${/مدیر نمی‌شناسد/.test(xeErr(e)) ? `<br><small dir="ltr" style="user-select:all">uid: ${esc(ADMIN?.uid || ADMIN?.id || '')}</small><br><small>این uid را در dx_admins ثبت کن (آخر فایل SQL توضیح داده شده)</small>` : ''}</p>`;
  }
  XE.busy = false;
}
async function xeSend() {
  const ins = [...document.querySelectorAll('#xeEditor .xe-in')].map(i => i.value.trim());
  if (ins.some(x => !x)) return toast('هر ۶ گزینه را پر کن');
  if (new Set(ins).size !== 6) return toast('گزینه‌ها نباید تکراری باشند');
  if (!XE.strokes.length) return toast('اول نقاشی بکش 🎨');
  const ok = +(document.querySelector('#xeEditor input[name="xeOk"]:checked')?.value ?? 0);
  const ops = []; let total = 0;
  for (const s of XE.strokes) for (let i = 0; i < s.p.length; i += 600) { const ch = s.p.slice(i, i + 600); ops.push({ t: 's', n: i === 0, c: s.c, w: s.w, p: ch }); total += ch.length; }
  if (total > 28000 || ops.length > 480) return toast('نقاشی خیلی پیچیده است؛ ساده‌ترش کن');
  const btn = $('xeSend'); btn.disabled = true;
  try {
    const { error } = await supa.rpc('dx_art_add', { p_options: ins, p_correct: ok, p_ops: ops }); if (error) throw error;
    toast('✅ نقاشی ثبت شد'); if (XE.src) { updateDoc(doc(db, 'museum', XE.src), { status: 'game', gameAt: Date.now() }).catch(() => {}); XE.src = null; $('xeSrc')?.remove(); } XE.strokes = []; xeRedraw(); document.querySelectorAll('#xeEditor .xe-in').forEach(i => { i.value = ''; }); XE.busy = false; xeLoad();
  } catch (e) { toast(xeErr(e)); } finally { btn.disabled = false; }
}
/* ====== موزه: نقاشی‌های کاربران ← ویرایش ← ارسال به بازی حذفی ====== */
const MU_ST = { new: '🆕 جدید', seen: '👀 دیده شد', game: '🎮 رفته به بازی', top: '🏆 در برترین‌ها', rejected: '❌ رد شد' };
const MU_EPOCH = Date.UTC(2024, 0, 6) - 12600000, MU_WEEK = 604800000;   // هفته‌ی رأی‌گیری: شنبه ۰۰:۰۰ به وقت ایران
function museumView(v) {
  const L = [...S.museum].sort((a, b) => (b.at || 0) - (a.at || 0));
  v.innerHTML = `<h3 class="sec">🏛 موزه • نقاشی‌های کاربران (${fa(L.length)})</h3>
    <small style="color:var(--mut);line-height:1.9">کاربران از دکمه‌ی «موزه» توی بازی نقاشی می‌فرستند. «ویرایش و ارسال به حذفی» نقاشی را روی تخته‌ی تب «نقاشی حذفی» باز می‌کند؛ تغییر بده، ۶ گزینه بنویس و بفرست.</small>
    <div class="gall">${L.map(g => `<div class="card gcell"><canvas width="240" height="240" data-mc="${g.id}" style="background:#14101c;border-radius:12px"></canvas><b>${esc(g.title || 'بدون نام')}</b>
      <small>👤 ${esc(g.name || '؟')} • ${MU_ST[g.status] || MU_ST.new} • ${ago(g.at || 0)}</small>
      <div class="btns"><button class="btn sm" data-mgo="${g.id}">✏️ ویرایش و ارسال به حذفی</button><button class="btn sm" data-mtop="${g.id}" style="background:linear-gradient(135deg,#f4c542,#c98a12);color:#2a1a00">🏆 ارسال به برترین‌ها</button>${g.status === 'new' || !g.status ? `<button class="btn sm ghost" data-mst="${g.id}" data-v="seen">👀 دیدم</button>` : ''}<button class="btn sm ghost" data-mst="${g.id}" data-v="rejected">رد</button><button class="btn sm bad" data-mdel="${g.id}">حذف</button></div></div>`).join('') || '<p class="empty">هنوز نقاشی‌ای نرسیده 🏛</p>'}</div>`;
  requestAnimationFrame(() => v.querySelectorAll('canvas[data-mc]').forEach(cv => { const g = S.museum.find(x => x.id === cv.dataset.mc); (g?.strokes || []).forEach(s => xPaint(cv, { n: true, c: s.c, w: s.w, p: s.p }, { last: null })); }));
}
function xartClick(e) {
  if (!e.target.closest('#xeEditor')) return false;
  const c = e.target.closest('[data-xc]'), w = e.target.closest('[data-xw]'), del = e.target.closest('[data-xdel]');
  if (c) { XE.color = +c.dataset.xc; document.querySelectorAll('#xeEditor .xe-c').forEach(b => b.classList.toggle('on', b === c)); return true; }
  if (w) { XE.size = +w.dataset.xw; document.querySelectorAll('#xeEditor .xe-s').forEach(b => b.classList.toggle('on', b === w)); return true; }
  if (e.target.closest('[data-xundo]')) { XE.strokes.pop(); xeRedraw(); return true; }
  if (e.target.closest('[data-xclear]')) { XE.strokes = []; xeRedraw(); return true; }
  if (e.target.closest('#xeSend')) { xeSend(); return true; }
  if (del) { if (confirm('این نقاشی برای همیشه از بازی حذف شود؟')) supa.rpc('dx_art_del', { p_id: del.dataset.xdel }).then(({ error }) => { if (error) return toast(xeErr(error)); toast('حذف شد'); XE.busy = false; xeLoad(); }); return true; }
  return false;
}

/* ====== کلیک‌ها (یک‌جا) ====== */
const rep = id => S.reports.find(r => r.id === id);
$('view').addEventListener('change', guard(async e => {
  const inp = e.target.closest('[data-pic]'); if (!inp || !inp.files[0]) return;
  const f = inp.files[0], k = inp.dataset.pic; inp.value = '';
  const p = await adminShrink(f, 256, .82);
  await setDoc(doc(db, 'rooms', k), { photo: p }, { merge: true }); toast('✅ عکس ' + (k === 'public' ? 'چت روم' : 'کانال') + ' عوض شد');
}));
$('view').addEventListener('click', guard(async e => {
  const t = e.target, q = sel => t.closest(sel);
  let b;
  if ((b = q('[data-mgo]'))) {
    const g = S.museum.find(x => x.id === b.dataset.mgo); if (!g) return;
    XE.pre = { id: g.id, name: g.name, title: g.title, strokes: (g.strokes || []).map(st => ({ c: st.c, w: st.w, p: (st.p || []).slice() })) };
    if (!g.status || g.status === 'new') updateDoc(doc(db, 'museum', g.id), { status: 'seen' }).catch(() => {});
    tab = 'xart'; chUnsub?.(); chUnsub = null; drawTabs(); draw(); return;
  }
  if ((b = q('[data-mtop]'))) {
    const g = S.museum.find(x => x.id === b.dataset.mtop); if (!g) return;
    const wk = Math.floor((Date.now() - MU_EPOCH) / MU_WEEK), left = Math.max(0, MU_EPOCH + (wk + 1) * MU_WEEK - Date.now()), days = Math.floor(left / 864e5), hrs = Math.floor(left % 864e5 / 36e5);
    const title = prompt(`اسم نقاشی برای نمایش (می‌توانی عوضش کنی)\nرأی‌گیری این هفته ${days} روز و ${hrs} ساعت دیگر تمام می‌شود.`, g.title || '');
    if (title === null) return;
    try {
      await setDoc(doc(db, 'mu_top', 'p_' + g.id), { src: g.id, uid: g.uid, name: g.name || '', handle: g.handle || '', title: title.trim().slice(0, 30), strokes: g.strokes || [], wk, at: Date.now() });
      await updateDoc(doc(db, 'museum', g.id), { status: 'top', topAt: Date.now() });
      toast('🏆 به برترین‌ها (رأی‌گیری این هفته) ارسال شد');
    } catch (err) { toast('ارسال نشد'); }
    return;
  }
  if ((b = q('[data-mst]'))) { await updateDoc(doc(db, 'museum', b.dataset.mst), { status: b.dataset.v }); return; }
  if ((b = q('[data-mdel]'))) { if (confirm('این نقاشی از موزه حذف شود؟')) await deleteDoc(doc(db, 'museum', b.dataset.mdel)); return; }
  if (xartClick(e)) return;
  if ((b = q('[data-picrm]'))) { await setDoc(doc(db, 'rooms', b.dataset.picrm), { photo: '' }, { merge: true }); toast('عکس حذف شد'); return; }
  if ((b = q('[data-mlby]'))) { mlBy = mlBy === b.dataset.mlby ? '' : b.dataset.mlby; draw(); return; }
  if ((b = q('[data-mloff]'))) { const u = S.users[b.dataset.mloff]; if (u && confirm(`${u.name} از ناظری برکنار شود؟ دکمه‌ی ناظر از حسابش پاک می‌شود.`)) { await updateDoc(doc(db, 'users', u.uid), { mod: false }); toast('🛡 برکنار شد'); } return; }
  if ((b = q('[data-mlok]'))) { await mlReview([+b.dataset.mlok]); return; }
  if (q('[data-mlall]')) { const ids = S.mlog.filter(x => !x.reviewed).map(x => x.id); if (ids.length) await mlReview(ids); toast('همه دیده شد ✓'); return; }
  if ((b = q('[data-mlundo]'))) {
    const x = S.mlog.find(m => m.id === +b.dataset.mlundo), u = x && S.users[x.target_uid]; if (!x) return;
    if (!u) return toast('کاربر پیدا نشد');
    if (!confirm('این کار ناظر برگردانده بشه؟')) return;
    const patch = x.action === 'ban' ? { banned: false } : x.action === 'mute' ? { mutedUntil: 0, warns: 0 } : { warns: Math.max(0, (u.warns || 0) - 1), ...(x.note ? { mutedUntil: 0 } : {}) };
    await updateDoc(doc(db, 'users', u.uid), patch); await mlReview([x.id], true); toast('↩ برگردونده شد'); return;
  }
  if ((b = q('[data-u]'))) return userModal(b.dataset.u);
  if ((b = q('[data-c]'))) return clanModal(b.dataset.c);
  if ((b = q('[data-chat]'))) return chatModal(b.dataset.chat, S.rooms[b.dataset.chat]?.name || 'گفتگو');
  if ((b = q('[data-rev]'))) { if (!confirm('این معامله لغو شود؟ کارت از خریدار گرفته و به فروشنده برمی‌گردد و سکه‌ی خریدار برمی‌گردد.')) return; try { await revertDeal(b.dataset.rev); toast('↩ معامله لغو شد'); } catch (er) { toast(er.message || 'لغو نشد'); } return; }
  if ((b = q('[data-end]'))) { if (!confirm('گروه معامله با همه‌ی پیام‌هایش حذف شود؟')) return; await nukeRoom(b.dataset.end); toast('گروه معامله حذف شد'); return; }
  if ((b = q('[data-rchat]'))) { const r = rep(b.dataset.rchat); return r && chatModal(r.room, r.roomName || 'گفتگو', r.msgId); }
  if ((b = q('[data-rdel]'))) { const r = rep(b.dataset.rdel); if (r && confirm('پیام گزارش‌شده حذف شود؟')) { await delMsg(r.room, r.msgId); await updateDoc(doc(db, 'reports', r.id), { status: 'done' }); } return; }
  if ((b = q('[data-rmute]'))) { const r = rep(b.dataset.rmute); if (r) { await updateDoc(doc(db, 'users', r.target), { mutedUntil: Date.now() + 86400000, warns: 0 }); await updateDoc(doc(db, 'reports', r.id), { status: 'done' }); toast('🔇 ساکت شد'); } return; }
  if ((b = q('[data-rban]'))) { const r = rep(b.dataset.rban); if (r && confirm(`${r.targetName} مسدود شود؟`)) { await updateDoc(doc(db, 'users', r.target), { banned: true }); await updateDoc(doc(db, 'reports', r.id), { status: 'done' }); toast('🚫 مسدود شد'); } return; }
  if ((b = q('[data-rok]'))) { await updateDoc(doc(db, 'reports', b.dataset.rok), { status: 'done' }); return; }
  if ((b = q('[data-rrm]'))) { await deleteDoc(doc(db, 'reports', b.dataset.rrm)); return; }
  if (q('#qAdd')) {
    const x = { cat: $('qCat').value, ask: $('qAsk').value.trim(), clue: $('qClue').value.trim(), big: $('qBig').value.trim(), answer: $('qAns').value.trim() };
    if (!x.ask || !x.answer) return toast('پرسش و پاسخ را بنویس');
    await addDoc(collection(db, 'questions'), { ...x, at: serverTimestamp() }); toast('✅ سوال اضافه شد'); return;
  }
  if ((b = q('[data-qd]'))) { if (confirm('این سوال حذف شود؟')) await deleteDoc(doc(db, 'questions', b.dataset.qd)); return; }
  if ((b = q('[data-gtog]'))) { const { error } = await supa.rpc('dg_admin_set', { p_id: b.dataset.gtog, p_status: b.dataset.st }); if (error) return toast('انجام نشد'); GALL = null; draw(); return; }
  if ((b = q('[data-gdel]'))) { if (!confirm('این نقاشی برای همیشه حذف شود؟')) return; const { error } = await supa.rpc('dg_admin_delete', { p_id: b.dataset.gdel }); if (error) return toast('حذف نشد'); GALL = null; draw(); return; }
  if (q('[data-gref]')) { GALL = null; draw(); return; }
  if ((b = q('[data-sdone]'))) { await updateDoc(doc(db, 'suggestions', b.dataset.sdone), { status: 'done' }); return; }
  if ((b = q('[data-sdel]'))) { await deleteDoc(doc(db, 'suggestions', b.dataset.sdel)); return; }
  if ((b = q('[data-pa]'))) { const u = S.users[b.dataset.pa]; await updateDoc(doc(db, 'users', u.uid), (u.photoMode === 'add' && u.photo) ? { gallery: [...(u.gallery || []), u.photoPending].slice(0, 3), photoPending: '', photoMode: '' } : { photo: u.photoPending, photoPending: '', photoMode: '' }); toast('عکس تایید شد ✅'); return; }
  if ((b = q('[data-pr]'))) { await updateDoc(doc(db, 'users', b.dataset.pr), { photoPending: '', photoMode: '', photoRejected: Date.now() }); toast('عکس رد شد'); return; }
  if ((b = q('[data-tg]'))) return saveBot({ [b.dataset.tg]: S.bot[b.dataset.tg] === false });
  if ((b = q('[data-delw]'))) return saveBot({ words: (S.bot.words || []).filter((_, i) => i !== +b.dataset.delw) });
  if ((b = q('[data-delr]'))) return saveBot({ replies: (S.bot.replies || []).filter((_, i) => i !== +b.dataset.delr) });
  if (q('[data-addw]')) { const w = $('botW').value.trim(); if (w) await saveBot({ words: [...(S.bot.words || []), w].slice(0, 100) }); return; }
  if (q('[data-addr]')) { const k = $('botK').value.trim(), v = $('botV').value.trim(); if (k && v) await saveBot({ replies: [...(S.bot.replies || []), { k, v }].slice(0, 80) }); else toast('هر دو کادر را پر کن'); return; }
  if (q('[data-savew]')) { await saveBot({ welcomeMsg: ($('botWelcome')?.value || '').trim().slice(0, 200) }); toast('خوش‌آمد ذخیره شد'); return; }
  if ((b = q('[data-preset]'))) {
    const presets = {
      game: { k: 'چطور بازی', v: '🎨 از دکمه‌ی بازی‌ها برو: امتیازی (۴ نفره)، حذفی (۶ نفره) یا دوئل. برنده الماس و جام می‌گیرد!' },
      league: { k: 'لیگ', v: '🏅 جام از بازی سریع امتیازی می‌آید. لیگ‌ها از سایه‌نویس تا خداوند قلم. از بخش کاربران → لیگ‌ها ببین.' },
      shop: { k: 'فروشگاه', v: '🛍 از آیکون الماس بالا برو فروشگاه؛ قاب، کاراکتر و کارت با الماس بخر.' }
    };
    const p = presets[b.dataset.preset]; if (!p) return;
    $('botK').value = p.k; $('botV').value = p.v; toast('نمونه پر شد — افزودن را بزن'); return;
  }
  if (q('#chPost')) { const x = $('chTxt').value.trim(); if (!x) return; $('chPost').disabled = true; await postChannel(x); toast('📣 ارسال شد'); $('chTxt').value = ''; $('chPost').disabled = false; return; }
  if ((b = q('[data-chd]'))) { if (confirm('این پیام از کانال حذف شود؟')) await delMsg('channel', b.dataset.chd); return; }
}));
</script>
