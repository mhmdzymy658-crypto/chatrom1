<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>در دست تعمیر | پرو چت</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: Vazirmatn, Tahoma, 'Segoe UI', sans-serif;
  background: #050505;
  color: #d4af37;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  position: relative;
}

/* پس‌زمینه گرادیانت */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(212,175,55,.18), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(212,175,55,.10), transparent 60%),
    radial-gradient(500px 400px at 50% 50%, rgba(212,175,55,.05), transparent 70%);
  pointer-events: none;
  animation: bgPulse 6s ease-in-out infinite;
}
@keyframes bgPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .6; }
}

/* ذرات شناور */
.particle {
  position: fixed;
  width: 4px;
  height: 4px;
  background: #d4af37;
  border-radius: 50%;
  box-shadow: 0 0 10px #d4af37;
  pointer-events: none;
  opacity: 0;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
}

/* کادر آتش‌بازی */
.firework-frame {
  position: relative;
  max-width: 520px;
  width: 100%;
  padding: 4px;
  border-radius: 32px;
  background: linear-gradient(135deg, #d4af37, #f5d77a, #8a6d12, #d4af37);
  background-size: 300% 300%;
  animation: borderGlow 3s ease-in-out infinite;
  box-shadow: 0 0 40px rgba(212,175,55,.5), 0 0 80px rgba(212,175,55,.25);
}
@keyframes borderGlow {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* جرقه‌های دور کادر */
.spark {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 3;
}

/* کارت اصلی */
.card {
  position: relative;
  z-index: 2;
  background: rgba(16,16,16,.95);
  border-radius: 28px;
  padding: 40px 24px;
  backdrop-filter: blur(10px);
  animation: cardIn 1s cubic-bezier(.2,1,.3,1);
  overflow: hidden;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(30px) scale(.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* بخش چرخ‌دنده و چراغ */
.top-visual {
  position: relative;
  height: 170px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
}

/* چرخ‌دنده */
.gear-wrap {
  position: relative;
  width: 90px;
  height: 90px;
  display: grid;
  place-items: center;
}
.gear {
  font-size: 4rem;
  filter: drop-shadow(0 0 20px rgba(212,175,55,.7));
  animation: spin 3s linear infinite;
  display: inline-block;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* چراغ راهنمایی */
.traffic-light {
  width: 70px;
  background: #1a1a1a;
  border: 3px solid #333;
  border-radius: 16px;
  padding: 10px 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 0 30px rgba(0,0,0,.8), inset 0 0 20px rgba(0,0,0,.5);
}
.light {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #2a2a2a;
  border: 2px solid #111;
  transition: all .3s;
}
.light.red.on {
  background: radial-gradient(circle at 35% 35%, #ff6b6b, #e5484d 60%, #8a1a1d);
  box-shadow: 0 0 25px #e5484d, 0 0 50px rgba(229,72,77,.5), inset 0 0 10px rgba(255,255,255,.3);
}
.light.blue.on {
  background: radial-gradient(circle at 35% 35%, #6bc4ff, #4da3ff 60%, #1d5fa8);
  box-shadow: 0 0 25px #4da3ff, 0 0 50px rgba(77,163,255,.5), inset 0 0 10px rgba(255,255,255,.3);
}
.light.green.on {
  background: radial-gradient(circle at 35% 35%, #7bff9d, #2fd18b 60%, #15774f);
  box-shadow: 0 0 25px #2fd18b, 0 0 50px rgba(47,209,139,.5), inset 0 0 10px rgba(255,255,255,.3);
}

/* متن طلایی */
.title {
  font-size: 1.9rem;
  font-weight: 800;
  background: linear-gradient(135deg, #f5d77a, #d4af37 50%, #8a6d12);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 8px;
  letter-spacing: -.5px;
}

.subtitle {
  color: #9a9078;
  font-size: 1rem;
  line-height: 1.9;
  margin-bottom: 16px;
}

/* تاریخ */
.date {
  display: inline-block;
  background: rgba(212,175,55,.1);
  border: 1px solid rgba(212,175,55,.3);
  border-radius: 999px;
  padding: 6px 18px;
  font-size: .85rem;
  color: #f5d77a;
  margin-bottom: 20px;
}
.date b {
  color: #fff;
  font-weight: 800;
}

/* خط جداکننده */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212,175,55,.5), transparent);
  margin: 18px 0;
}

/* امضا */
.signature {
  font-size: .9rem;
  color: #9a9078;
}
.signature b {
  background: linear-gradient(135deg, #f5d77a, #d4af37);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  font-weight: 800;
  font-size: 1.1rem;
}

/* نقطه‌های چشمک‌زن */
.dots {
  display: inline-flex;
  gap: 4px;
  margin-inline-start: 4px;
  vertical-align: middle;
}
.dots span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #d4af37;
  animation: blink 1.4s infinite;
}
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink {
  0%, 100% { opacity: .3; transform: scale(.8); }
  50% { opacity: 1; transform: scale(1.2); }
}
</style>
</head>
<body>

<div class="firework-frame" id="frame">
  <div class="card">
    <div class="top-visual">
      <div class="gear-wrap">
        <span class="gear">⚙️</span>
      </div>
      <div class="traffic-light">
        <div class="light red" id="redLight"></div>
        <div class="light blue" id="blueLight"></div>
        <div class="light green" id="greenLight"></div>
      </div>
    </div>

    <h1 class="title">سایت در دست تعمیر است</h1>
    <p class="subtitle">
      به‌زودی برمی‌گردیم با امکانات ویژه‌تر
      <span class="dots"><span></span><span></span><span></span></span>
    </p>

    <div class="date">
      📅 تاریخ بازگشت: <b>۱ آبان</b>
    </div>

    <div class="divider"></div>

    <p class="signature">
      سازنده: <b>ممد فرعون</b> 👑
    </p>
  </div>
</div>

<script>
// ==================== ذرات شناور ====================
for (let i = 0; i < 20; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.animationDuration = (6 + Math.random() * 8) + 's';
  p.style.animationDelay = (Math.random() * 8) + 's';
  p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
  document.body.appendChild(p);
}

// ==================== چراغ راهنمایی (قرمز → آبی → سبز) ====================
const red = document.getElementById('redLight');
const blue = document.getElementById('blueLight');
const green = document.getElementById('greenLight');
const lights = [red, blue, green];
let currentLight = 0;

function cycleLights() {
  lights.forEach(l => l.classList.remove('on'));
  lights[currentLight].classList.add('on');
  currentLight = (currentLight + 1) % 3;
}
cycleLights();
setInterval(cycleLights, 1500);

// ==================== فشفشه دور کادر ====================
const frame = document.getElementById('frame');
const COLORS = ['#d4af37', '#f5d77a', '#ff6b6b', '#4da3ff', '#2fd18b', '#b57cff', '#ffc83d'];

function getFramePoint() {
  const rect = frame.getBoundingClientRect();
  const side = Math.floor(Math.random() * 4);
  const pad = 5;
  let x, y;
  if (side === 0) { x = rect.left + Math.random() * rect.width; y = rect.top + pad; }
  else if (side === 1) { x = rect.right - pad; y = rect.top + Math.random() * rect.height; }
  else if (side === 2) { x = rect.left + Math.random() * rect.width; y = rect.bottom - pad; }
  else { x = rect.left + pad; y = rect.top + Math.random() * rect.height; }
  return { x, y };
}

function createSpark() {
  const { x, y } = getFramePoint();
  const spark = document.createElement('div');
  spark.className = 'spark';
  const color = COLORS[Math.floor(Math.random() * COLORS.length)];
  const size = 4 + Math.random() * 6;
  spark.style.width = spark.style.height = size + 'px';
  spark.style.background = color;
  spark.style.boxShadow = `0 0 ${size * 2}px ${color}, 0 0 ${size * 4}px ${color}`;
  spark.style.left = x + 'px';
  spark.style.top = y + 'px';
  spark.style.position = 'fixed';
  document.body.appendChild(spark);

  // انیمیشن پخش شدن
  const angle = Math.random() * Math.PI * 2;
  const distance = 40 + Math.random() * 70;
  const tx = Math.cos(angle) * distance;
  const ty = Math.sin(angle) * distance;

  spark.animate([
    { transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
  ], {
    duration: 900 + Math.random() * 500,
    easing: 'cubic-bezier(.2,.8,.3,1)'
  }).onfinish = () => spark.remove();
}

// هر ۱۵۰ میلی‌ثانیه یه جرقه جدید
setInterval(createSpark, 150);

// اولش یه انفجار بزرگ
for (let i = 0; i < 30; i++) {
  setTimeout(createSpark, i * 30);
}
</script>

</body>
  </html>
