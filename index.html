<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت در حال تعمیر است | محمد فرعون</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: #03060d;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ===== پس‌زمینه ===== */
        .bg-layer {
            position: absolute; inset: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(0, 100, 255, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(255, 80, 0, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(10, 20, 40, 0.9) 0%, #03060d 100%);
            z-index: 1;
        }

        .grid-overlay {
            position: absolute; inset: 0;
            background-image: 
                linear-gradient(rgba(0, 150, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 150, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 2;
            mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
        }

        /* ذرات */
        .particles { position: absolute; inset: 0; z-index: 3; overflow: hidden; }
        .particle {
            position: absolute; width: 3px; height: 3px;
            background: #00aaff; border-radius: 50%;
            box-shadow: 0 0 10px #00aaff, 0 0 20px #00aaff;
            animation: floatUp linear infinite; opacity: 0;
        }
        .particle.orange { background: #ff8800; box-shadow: 0 0 10px #ff8800, 0 0 20px #ff8800; }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; } 90% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }

        /* ===== کارت اصلی ===== */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 65px 55px 80px;
            max-width: 700px;
            width: 92%;
            background: rgba(10, 18, 35, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            box-shadow: 
                0 0 80px rgba(0, 100, 255, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            animation: cardIn 1.2s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== ابان‌خط دور قاب (نوار گرادینتی متحرک) ===== */
        .container::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 30px;
            padding: 2px;
            background: linear-gradient(135deg, 
                #ffaa00 0%, #00aaff 25%, #ff8800 50%, #00aaff 75%, #ffaa00 100%);
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderFlow 6s linear infinite;
            pointer-events: none;
            z-index: 11;
        }

        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* ===== نوار تاریخ برگشت (پایین کارت) ===== */
        .return-date-bar {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 35px;
            background: linear-gradient(135deg, rgba(10, 18, 35, 0.98), rgba(20, 30, 55, 0.98));
            border: 2px solid transparent;
            background-clip: padding-box;
            border-radius: 50px;
            font-size: 1rem;
            color: #fff;
            white-space: nowrap;
            box-shadow: 
                0 0 30px rgba(255, 170, 0, 0.4),
                0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 15;
            animation: datePulse 3s ease-in-out infinite;
        }

        /* حاشیه گرادینتی نوار تاریخ */
        .return-date-bar::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50px;
            padding: 2px;
            background: linear-gradient(135deg, #ffaa00, #ff8800, #ffcc00, #ffaa00);
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderFlow 4s linear infinite;
            z-index: -1;
        }

        @keyframes datePulse {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 170, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.5); }
            50% { box-shadow: 0 0 50px rgba(255, 170, 0, 0.7), 0 10px 30px rgba(0, 0, 0, 0.5); }
        }

        .return-icon {
            width: 22px; height: 22px;
            stroke: #ffcc00;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 8px #ffcc00);
            animation: rotate 8s linear infinite;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .return-label {
            color: #a8b8cc;
            font-size: 0.95rem;
        }

        .return-date {
            font-weight: 900;
            font-size: 1.15rem;
            background: linear-gradient(135deg, #ffcc00, #ff8800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 12px rgba(255, 170, 0, 0.6));
        }

        /* ===== چرخ‌دنده‌ها ===== */
        .gear-wrapper {
            position: relative;
            width: 130px; height: 130px;
            margin: 0 auto 30px;
            display: flex; justify-content: center; align-items: center;
        }
        .gear-wrapper::before {
            content: '';
            position: absolute; inset: -20px;
            background: radial-gradient(circle, rgba(0, 150, 255, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        .gear-main {
            width: 100px; height: 100px;
            animation: spin 8s linear infinite;
            filter: drop-shadow(0 0 15px #00aaff);
            position: relative; z-index: 2;
        }
        .gear-small {
            position: absolute; bottom: 5px; left: 5px;
            width: 55px; height: 55px;
            animation: spinReverse 5s linear infinite;
            filter: drop-shadow(0 0 12px #ff8800);
            z-index: 3;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spinReverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

        /* ===== متن‌ها ===== */
        .main-title {
            font-size: 3.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffcc00 0%, #fff 50%, #ff8800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 18px;
            filter: drop-shadow(0 0 30px rgba(255, 170, 0, 0.4));
        }

        .sub-title {
            font-size: 1.15rem;
            color: #a8b8cc;
            margin-bottom: 40px;
            line-height: 1.9;
        }

        /* نوار پیشرفت */
        .progress-container {
            width: 100%; height: 6px;
            background: rgba(0, 150, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 40px;
            overflow: hidden;
            border: 1px solid rgba(0, 150, 255, 0.15);
        }
        .progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #00aaff, #ff8800);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.8);
            animation: progressLoad 4s ease-in-out infinite;
        }
        @keyframes progressLoad {
            0% { width: 15%; } 50% { width: 85%; } 100% { width: 15%; }
        }

        /* ===== سازنده با تاج روی فرعون ===== */
        .creator-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 30px;
        }
        .line {
            height: 1px; width: 70px;
            background: linear-gradient(90deg, transparent, rgba(255, 170, 0, 0.6), transparent);
        }
        .creator-name {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .king-wrapper {
            position: relative;
            display: inline-block;
            padding-top: 18px;
        }

        .king-wrapper .crown-on-word {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%) rotate(-8deg);
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 0 10px #ffaa00) drop-shadow(0 0 20px rgba(255, 170, 0, 0.6));
            animation: crownFloat 3s ease-in-out infinite;
        }

        @keyframes crownFloat {
            0%, 100% { transform: translateX(-50%) rotate(-8deg) translateY(0); }
            50% { transform: translateX(-50%) rotate(-8deg) translateY(-4px); }
        }

        .king-word {
            background: linear-gradient(135deg, #ffcc00, #ff8800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            filter: drop-shadow(0 0 12px rgba(255, 170, 0, 0.5));
        }

        /* ===== آیکون‌های پایین ===== */
        .icons-row {
            display: flex;
            justify-content: center;
            gap: 60px;
        }
        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #7a8a9a;
            font-size: 0.9rem;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
            cursor: pointer;
        }
        .icon-item svg {
            width: 32px; height: 32px;
            stroke: #7a8a9a;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.4s ease;
            filter: drop-shadow(0 0 6px rgba(0, 150, 255, 0.3));
        }
        .icon-item:hover { color: #ffaa00; transform: translateY(-8px); }
        .icon-item:hover svg { stroke: #ffaa00; filter: drop-shadow(0 0 15px #ffaa00); }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 600px) {
            .container { padding: 45px 25px 70px; border-radius: 22px; }
            .main-title { font-size: 2.3rem; }
            .sub-title { font-size: 0.95rem; }
            .gear-wrapper { width: 100px; height: 100px; }
            .gear-main { width: 75px; height: 75px; }
            .gear-small { width: 42px; height: 42px; }
            .creator-name { font-size: 1rem; }
            .icons-row { gap: 30px; }
            .icon-item svg { width: 26px; height: 26px; }
            .icon-item { font-size: 0.8rem; }
            .line { width: 40px; }
            .king-wrapper .crown-on-word { width: 24px; height: 24px; top: -6px; }
            .return-date-bar { padding: 10px 20px; font-size: 0.85rem; bottom: -22px; gap: 8px; }
            .return-date { font-size: 0.95rem; }
            .return-label { font-size: 0.8rem; }
            .return-icon { width: 18px; height: 18px; }
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div class="grid-overlay"></div>
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- چرخ‌دنده‌ها -->
        <div class="gear-wrapper">
            <svg class="gear-main" viewBox="0 0 24 24" fill="none" stroke="#00aaff" stroke-width="1.5">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
            </svg>
            <svg class="gear-small" viewBox="0 0 24 24" fill="none" stroke="#ff8800" stroke-width="1.5">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
            </svg>
        </div>

        <h1 class="main-title">برگشت به زودی</h1>
        <p class="sub-title">سایت در حال تعمیر و به‌روزرسانی است...<br>به زودی با قدرت برمی‌گردیم!</p>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <!-- سازنده با تاج روی فرعون -->
        <div class="creator-section">
            <span class="line"></span>
            <span class="creator-name">
                سازنده: محمد
                <span class="king-wrapper">
                    <svg class="crown-on-word" viewBox="0 0 24 24" fill="#ffcc00" stroke="#ff8800" stroke-width="1">
                        <path d="M2 18h20l-2-10-5 4-3-7-3 7-5-4-2 10z"/>
                        <circle cx="12" cy="4" r="1.2" fill="#fff"/>
                        <circle cx="5" cy="7" r="0.9" fill="#fff"/>
                        <circle cx="19" cy="7" r="0.9" fill="#fff"/>
                    </svg>
                    <span class="king-word">فرعون</span>
                </span>
            </span>
            <span class="line"></span>
        </div>

        <!-- آیکون‌های پایین -->
        <div class="icons-row">
            <div class="icon-item">
                <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                <span>در حال بهبود</span>
            </div>
            <div class="icon-item">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
                <span>با عشق</span>
            </div>
            <div class="icon-item">
                <svg viewBox="0 0 24 24">
                    <line x1="6" y1="12" x2="10" y2="12"/>
                    <line x1="8" y1="10" x2="8" y2="14"/>
                    <line x1="15" y1="13" x2="15.01" y2="13"/>
                    <line x1="18" y1="11" x2="18.01" y2="11"/>
                    <path d="M17.32 5H6.68a4 4 0 00-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 003 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 019.828 16h4.344a2 2 0 011.414.586L17 18c.5.5 1 1 2 1a3 3 0 003-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0017.32 5z"/>
                </svg>
                <span>برای شما</span>
            </div>
        </div>

        <!-- ===== نوار تاریخ برگشت (ابان‌خط پایین کارت) ===== -->
        <div class="return-date-bar">
            <svg class="return-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
            </svg>
            <span class="return-label">تاریخ برگشت:</span>
            <span class="return-date" id="return-date">در حال محاسبه...</span>
        </div>
    </div>

    <script>
        // ===== ذرات نور =====
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 40; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            if (Math.random() > 0.7) p.classList.add('orange');
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 8 + 6) + 's';
            p.style.animationDelay = Math.random() * 8 + 's';
            const size = Math.random() * 3 + 1;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            particlesContainer.appendChild(p);
        }

        // ===== تاریخ برگشت (خودکار: ۷ روز بعد از امروز) =====
        function getReturnDate() {
            const now = new Date();
            // ۷ روز جلوتر (اگه خواستی روز دیگه‌ای باشه، عدد رو تغییر بده)
            const returnDate = new Date(now.getTime() + (7 * 24 * 60 * 60 * 1000));
            
            const persianDate = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            }).format(returnDate);

            document.getElementById('return-date').textContent = persianDate;
        }

        getReturnDate();
    </script>

</body>
</html>
