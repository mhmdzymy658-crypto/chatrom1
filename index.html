<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>در دست تعمیر | پرو چت</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: Vazirmatn, Tahoma, 'Segoe UI', sans-serif;
  background: #050505;
  color: #d4af37;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  position: relative;
}

/* پس‌زمینه گرادیانت */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(212,175,55,.18), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(212,175,55,.10), transparent 60%),
    radial-gradient(500px 400px at 50% 50%, rgba(212,175,55,.05), transparent 70%);
  pointer-events: none;
  animation: bgPulse 6s ease-in-out infinite;
}
@keyframes bgPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .6; }
}

/* ذرات شناور */
.particle {
  position: fixed;
  width: 4px;
  height: 4px;
  background: #d4af37;
  border-radius: 50%;
  box-shadow: 0 0 10px #d4af37;
  pointer-events: none;
  opacity: 0;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
}

/* کارت اصلی */
.card {
  position: relative;
  z-index: 2;
  max-width: 500px;
  width: 100%;
  background: rgba(16,16,16,.85);
  border: 1.5px solid rgba(212,175,55,.4);
  border-radius: 28px;
  padding: 40px 24px;
  box-shadow:
    0 30px 80px rgba(0,0,0,.6),
    0 0 60px rgba(212,175,55,.15),
    inset 0 0 40px rgba(212,175,55,.05);
  backdrop-filter: blur(10px);
  animation: cardIn 1s cubic-bezier(.2,1,.3,1);
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(30px) scale(.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* چرخ‌دنده */
.gear-wrap {
  position: relative;
  width: 120px;
  height: 120px;
  margin: 0 auto 24px;
  display: grid;
  place-items: center;
}
.gear {
  font-size: 5rem;
  filter: drop-shadow(0 0 20px rgba(212,175,55,.7));
  animation: spin 3s linear infinite;
  display: inline-block;
}
.gear2 {
  position: absolute;
  font-size: 3rem;
  bottom: 0;
  right: 0;
  filter: drop-shadow(0 0 15px rgba(212,175,55,.6));
  animation: spinReverse 2s linear infinite;
  opacity: .8;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes spinReverse {
  to { transform: rotate(-360deg); }
}

/* متن طلایی */
.title {
  font-size: 2rem;
  font-weight: 800;
  background: linear-gradient(135deg, #f5d77a, #d4af37 50%, #8a6d12);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 8px;
  letter-spacing: -.5px;
}

.subtitle {
  color: #9a9078;
  font-size: 1rem;
  line-height: 1.9;
  margin-bottom: 20px;
}

/* بج امکانات */
.features {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 24px;
}
.feature {
  background: rgba(212,175,55,.1);
  border: 1px solid rgba(212,175,55,.3);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: .82rem;
  color: #f5d77a;
  display: flex;
  align-items: center;
  gap: 5px;
  animation: featureIn .6s ease-out backwards;
}
.feature:nth-child(1) { animation-delay: .3s; }
.feature:nth-child(2) { animation-delay: .5s; }
.feature:nth-child(3) { animation-delay: .7s; }
@keyframes featureIn {
  from { opacity: 0; transform: scale(.5); }
  to { opacity: 1; transform: scale(1); }
}

/* خط جداکننده */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212,175,55,.5), transparent);
  margin: 20px 0;
}

/* امضا */
.signature {
  font-size: .9rem;
  color: #9a9078;
}
.signature b {
  background: linear-gradient(135deg, #f5d77a, #d4af37);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  font-weight: 800;
  font-size: 1.05rem;
}

/* نقطه‌های چشمک‌زن */
.dots {
  display: inline-flex;
  gap: 4px;
  margin-inline-start: 4px;
}
.dots span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #d4af37;
  animation: blink 1.4s infinite;
}
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink {
  0%, 100% { opacity: .3; transform: scale(.8); }
  50% { opacity: 1; transform: scale(1.2); }
}
</style>
</head>
<body>

<div class="card">
  <div class="gear-wrap">
    <span class="gear">⚙️</span>
    <span class="gear2">⚙️</span>
  </div>

  <h1 class="title">سایت در دست تعمیر است</h1>
  <p class="subtitle">
    به‌زودی برمی‌گردیم
    <span class="dots"><span></span><span></span><span></span></span>
    <br>
    ممنون از صبر شما 🙏
  </p>

  <div class="features">
    <div class="feature">🎨 گرافیک خفن</div>
    <div class="feature">⚡ امکانات جدید</div>
    <div class="feature">🚀 سرعت بالا</div>
  </div>

  <div class="divider"></div>

  <p class="signature">
    سازنده: <b>ممد فرعون</b> 👑
  </p>
</div>

<script>
// ساخت ذرات شناور
for (let i = 0; i < 20; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.animationDuration = (6 + Math.random() * 8) + 's';
  p.style.animationDelay = (Math.random() * 8) + 's';
  p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
  document.body.appendChild(p);
}
</script>

</body>
</html>
