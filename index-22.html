    ? `<div class="qz-info">🔎 در حال پیدا کردن حریف… بازی با ${fa(g.max)} نفر شروع می‌شود</div><div class="qz-info" id="qzFill"></div>`
    : `<div class="qz-info">کد اتاق رو برای دوستات بفرست</div><div class="qz-code">${g.code}</div>
       <div class="qz-btns"><button class="btn ghost" id="qzCopy">📋 کپی کد</button><button class="btn ghost" id="qzShare">📤 ارسال</button></div>`;
  const startB = g.isPublic ? '' : (g.host === me.uid ? `<button class="btn" id="qzStartB" style="margin-bottom:8px" ${g.players.length < g.minStart ? 'disabled' : ''}>▶ شروع بازی</button>` : '<div class="qz-info">منتظر شروع بازی توسط میزبان…</div>');
  $('qzBody').innerHTML = `${top}<div class="qz-cnt"><b>${fa(g.players.length)}</b> از ${fa(g.max)} نفر</div><div class="qz-slots">${slots}</div>${startB}<button class="btn ghost" id="qzOut">خروج</button>`;
  $('qzCopy')?.addEventListener('click', () => { navigator.clipboard?.writeText(g.code).then(() => toast('کد کپی شد'), () => toast(g.code)); });
  $('qzShare')?.addEventListener('click', () => { const t = `بیا نقاشی بازی کنیم! 🎨 کد اتاق: ${g.code}`; if (navigator.share) navigator.share({ text: t }).catch(() => {}); else navigator.clipboard?.writeText(t).then(() => toast('متن دعوت کپی شد')); });
  $('qzStartB')?.addEventListener('click', () => gs.emit('start', r => { if (!r?.ok) toast('شروع نشد'); }));
  $('qzOut').onclick = qzLeave;
}
function qzBuildGame(g) {
  const M = QZ_MODES[g.mode], isP = g.mode === 'classic' && g.painter === me.uid;
  $('qzTitle').textContent = `${M.ic} ${M.n}`;
  $('qzBody').innerHTML = `<div class="qz-top"><div class="qz-chips"><span>${M.ic} ${M.n}</span></div><div class="qz-rd">دور <b>${fa(g.round)}</b>${g.mode === 'classic' ? ' از ' + fa(g.total) : ''}</div></div>
    <div class="dg-bar"><div class="dg-ring"><svg width="56" height="56" viewBox="0 0 56 56"><circle class="bg" cx="28" cy="28" r="24" fill="none" stroke-width="5"/><circle class="fg" id="dgFg" cx="28" cy="28" r="24" fill="none" stroke-width="5" stroke-dasharray="${DG_RING}" stroke-dashoffset="0"/></svg><b id="dgT"></b></div><div class="dg-msg" id="dgMsg"></div></div>
    <div class="dg-cvw"><canvas id="dgCv" width="800" height="800"></canvas><div class="dg-cd hidden" id="dgCd"></div></div>
    ${isP ? `<div class="dg-tools" id="dgTools"><div class="dg-cols">${DG_COLORS.map((c, i) => `<button class="dg-col ${i === 0 ? 'on' : ''}" data-c="${c}" style="background:${c}" aria-label="${c === '#ffffff' ? 'پاک‌کن' : 'رنگ'}"></button>`).join('')}</div>
      <div class="dg-sz">${DG_SIZES.map((s, i) => `<button class="dg-s ${i === 1 ? 'on' : ''}" data-s="${s}"><i style="width:${Math.round(s / 1.5) + 4}px;height:${Math.round(s / 1.5) + 4}px"></i></button>`).join('')}<button class="dg-act" data-a="u" aria-label="برگردان">↩️</button><button class="dg-act" data-a="c" aria-label="پاک کردن همه">🗑</button></div></div>`
      : `<div class="dg-opts" id="dgOpts">${(g.options || []).map((o, i) => `<button class="dg-opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`}
    <div class="qz-note" id="qzNote"></div><div class="sec-t">بازیکن‌ها</div><div class="qz-pl" id="qzPl"></div>`;
  dg.cv = $('dgCv'); dg.ctx = dg.cv.getContext('2d'); dgRedraw(); dgBindCanvas(isP);
  if (isP) {
    dg.color = DG_COLORS[0]; dg.size = DG_SIZES[1];
    $('dgTools').onclick = e => {
      const c = e.target.closest('[data-c]'), s = e.target.closest('[data-s]'), a = e.target.closest('[data-a]');
      if (c) { dg.color = c.dataset.c; $('dgTools').querySelectorAll('.dg-col').forEach(b => b.classList.toggle('on', b === c)); }
      else if (s) { dg.size = +s.dataset.s; $('dgTools').querySelectorAll('.dg-s').forEach(b => b.classList.toggle('on', b === s)); }
      else if (a && dgCanDraw()) { dgEmit({ k: a.dataset.a }); dgFlush(); }
    };
  } else {
    $('dgOpts').onclick = e => { const b = e.target.closest('[data-i]'); if (!b || b.disabled) return; navigator.vibrate?.(20); gs.emit('guess', { idx: +b.dataset.i }); };
  }
}
function qzUpdateGame(g) {
  const reveal = g.phase === 'reveal', isP = g.mode === 'classic' && g.painter === me.uid, mp = g.players.find(p => p.uid === me.uid), out = !!mp?.out;
  const started = sNow() >= g.startsAt || reveal, my = g.myGuess, ci = reveal ? (g.options || []).indexOf(g.word) : -1;
  document.querySelectorAll('#dgOpts .dg-opt').forEach((b, i) => {
    let c = 'dg-opt';
    if (reveal) c += i === ci ? ' ok' : i === my ? ' bad' : ' dim';
    else if (my != null) c += i === my ? (g.myCorrect ? ' ok' : ' bad') : ' dim';
    b.className = c; b.disabled = reveal || my != null || !started;
  });
  const painter = g.painter ? qzNm(g.painter, g) : '';
  const msg = $('dgMsg');
  if (msg) {
    if (reveal) msg.innerHTML = `✅ جواب: <b>${esc(g.word || '')}</b>`;
    else if (!started) msg.textContent = 'آماده باش…';
    else if (isP) msg.innerHTML = `🎨 این رو بکش: <b>${esc(g.word || '')}</b>`;
    else if (g.mode === 'classic') msg.innerHTML = `✏️ <b>${painter}</b> داره نقاشی می‌کشه؛ حدس بزن!`;
    else msg.textContent = out ? '💀 حذف شدی؛ فقط تماشا کن' : 'نقاشی رو ببین و موضوعش رو حدس بزن ⚡';
  }
  const note = $('qzNote');
  if (note) {
    if (reveal) {
      const gn = g.reveal?.gains?.[me.uid] || 0, names = (g.reveal?.out || []).map(u => qzU(u, g).name).join('، ');
      note.textContent = (g.mode === 'classic' ? (gn ? `🎯 +${fa(gn)} امتیاز` : 'این دور امتیازی نگرفتی') : (out ? '💀 حذف شدی' : '✅ زنده موندی')) + (names ? ` • ❌ حذف: ${names}` : '');
    } else if (isP) note.textContent = 'با انگشتت نقاشی بکش! تماشاچی‌ها زنده می‌بینن 👀';
    else if (my != null) note.textContent = g.myCorrect ? (out ? '🎯 درست بود (فقط تماشا)' : '🎯 درسته! منتظر بقیه…') : '✖ اشتباه بود؛ منتظر بقیه…';
    else note.textContent = started ? 'سریع‌تر حدس بزنی، بهتره! ⚡' : '';
  }
  const pl = $('qzPl'); if (!pl) return;
  const order = g.mode === 'classic' ? [...g.players].sort((a, b) => b.score - a.score) : [...g.players].sort((a, b) => (a.out - b.out) || b.score - a.score);
  pl.innerHTML = order.map(p => {
    let st = '', gt = '';
    if (p.left) st = '<span class="st r">🚪</span>';
    else if (reveal) { const gp = g.reveal?.gains?.[p.uid] || 0, gu = g.reveal?.guesses?.[p.uid];
      st = gp ? `<span class="st g">+${fa(gp)}</span>` : `<span class="st r">${p.out ? '💀' : gu && !gu.ok ? '✖' : '—'}</span>`;
      if (gu) gt = `<small class="dg-gt ${gu.ok ? 'ok' : 'bad'}">${esc(g.options?.[gu.idx] ?? '')}</small>`; }
    else if (g.mode === 'classic' && p.uid === g.painter) st = '<span class="st">✏️</span>';
    else st = `<span class="st">${p.out ? '💀' : ''}${p.guessed ? '✅' : '⏳'}</span>`;
    return `<div class="qz-p ${p.uid === me.uid ? 'me' : ''} ${p.out || p.left ? 'out' : ''}">${qzAv(p.uid, g)}<b>${qzNm(p.uid, g)}${gt ? '<br>' + gt : ''}</b>${st}<i>${fa(p.score || 0)}</i></div>`;
  }).join('');
}
function qzEnd(g) {
  const res = g.result || [], my = res.find(x => x.uid === me.uid), w = res[0], M = QZ_MODES[g.mode], md = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣', '6️⃣'];
  $('qzTitle').textContent = '🏁 پایان بازی';
  const detail = r => g.mode === 'classic' ? `${fa(r.score)} امتیاز` : (r.win ? 'برنده' : `حذف در دور ${fa(r.elimR)}`);
  $('qzBody').innerHTML = `${w ? `<div class="qz-win"><span class="qz-crown">👑</span>${qzAv(w.uid, g)}<b>${qzNm(w.uid, g)}</b><small>${detail(w)} • ${w.win ? 'برنده‌ی بازی!' : 'بدون برنده'}</small></div>` : ''}
    ${my ? `<div class="qz-info" style="color:#f5d77a;font-weight:800">${my.win ? `🎉 تبریک! 🪙 +${fa(M.coin)} سکه • ` : ''}🏆 ${my.cupsDelta >= 0 ? '+' : ''}${fa(my.cupsDelta)} جام</div>` : ''}
    ${res.map(r => `<div class="qz-rk ${r.uid === me.uid ? 'me' : ''}"><span class="md">${md[r.rank - 1] || fa(r.rank)}</span>${qzAv(r.uid, g)}<b>${qzNm(r.uid, g)}<br><small style="color:#9a9078;font-weight:400">${detail(r)}</small></b><i style="color:${r.cupsDelta >= 0 ? '#2fd18b' : '#e5484d'}">${r.cupsDelta >= 0 ? '▲ +' : '▼ '}${fa(r.cupsDelta)} 🏆</i></div>`).join('')}
    <div class="qz-btns" style="margin-top:14px"><button class="btn full" id="qzAgain">🔁 بازی دوباره</button><button class="btn ghost full" id="qzBackB">بازگشت به بازی‌ها</button></div>`;
  $('qzAgain').onclick = () => { const m = g.mode; qzLeave(true); qzSetup(m); };
  $('qzBackB').onclick = () => qzLeave();
  const key = g.code + ':' + g.round + ':' + g.winner;
  if (qzFxId !== key) { qzFxId = key; if (my?.win) { qzFx(); navigator.vibrate?.([60, 40, 60, 40, 120]); } }
  if (qzClaimedId !== key) { qzClaimedId = key; qzClaim(g); }
}
/* فشفشه و کاغذرنگی */
function qzFx() {
  const box = document.createElement('div'); box.className = 'qz-fx'; document.body.appendChild(box);
  const cols = ['#f5d77a', '#d4af37', '#ffffff', '#2fd18b', '#e5484d', '#7cc4ff'];
  for (let b = 0; b < 6; b++) setTimeout(() => {
    const cx = 15 + Math.random() * 70, cy = 12 + Math.random() * 38;
    for (let i = 0; i < 20; i++) { const p = document.createElement('i'), a = i / 20 * Math.PI * 2, d = 60 + Math.random() * 70;
      p.style.cssText = `left:${cx}%;top:${cy}%;background:${cols[(Math.random() * cols.length) | 0]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px`; box.appendChild(p); }
  }, b * 420);
  for (let i = 0; i < 46; i++) { const c = document.createElement('s');
    c.style.cssText = `left:${Math.random() * 100}%;background:${cols[(Math.random() * cols.length) | 0]};animation-duration:${2.4 + Math.random() * 2}s;animation-delay:${Math.random() * 1.2}s`; box.appendChild(c); }
  setTimeout(() => box.remove(), 6200);
}
/* تایمر دایره‌ای، شمارش معکوس و پخش نقاشی ضبط‌شده */
function qzTick() {
  const g = qzG; if (!g || qzView !== 'game') return;
  const t = sNow();
  if (g.status === 'waiting') { const el = $('qzFill'); if (el) el.textContent = g.fillAt ? `⏱ اگه کسی نیاد، بازی تا ${fa(Math.max(0, Math.ceil((g.fillAt - t) / 1000)))} ثانیه‌ی دیگه شروع می‌شود` : ''; return; }
  if (g.status !== 'playing') return;
  const fg = $('dgFg'), tt = $('dgT'), cd = $('dgCd'); if (!fg) return;
  if (g.phase === 'draw' && t < g.startsAt) {
    cd.textContent = fa(Math.max(1, Math.ceil((g.startsAt - t) / 1000))); cd.classList.remove('hidden'); tt.textContent = ''; fg.style.strokeDashoffset = '0'; fg.style.stroke = '#2fd18b';
  } else {
    cd.classList.add('hidden');
    const dur = Math.max(1, g.endsAt - g.startsAt), left = Math.max(0, g.endsAt - t), frac = Math.min(1, left / dur), rv = g.phase === 'reveal';
    fg.style.strokeDashoffset = (DG_RING * (1 - frac)).toFixed(1);
    fg.style.stroke = rv ? '#d4af37' : frac > .6 ? '#2fd18b' : frac > .3 ? '#f5c542' : '#e5484d';
    tt.textContent = rv ? '⏭' : fa(Math.ceil(left / 1000));
  }
  const live = t >= g.startsAt; if (dg.live !== live) { dg.live = live; qzUpdateGame(g); }
  if (g.mode === 'knockout' && dg.koRec && dg.koRec.round === g.round) {
    const el = g.phase === 'draw' ? t - g.startsAt : 1e9, ops = dg.koRec.ops;
    while (dg.koIdx < ops.length && ops[dg.koIdx].t <= el) dgOp(ops[dg.koIdx++]);
  }
}
setInterval(qzTick, 120);

/* ---- خروج و دکمه‌ها ---- */
function qzLeave(silent) { try { gs?.emit('leave'); } catch (e) {} qzG = null; qzDomKey = ''; dgNewRound(); if (!silent) qzHub(); }
function qzStop() {      // هنگام خروج از حساب
  try { gs?.disconnect(); } catch (e) {} gs = null; gsOk = false; qzG = null; qzDomKey = ''; qzView = 'hub'; $('qz')?.classList.add('hidden');
}
function qzBack() {
  if (qzView === 'hub') { $('qz').classList.add('hidden'); return; }
  if (qzView === 'setup' || qzView === 'board') return qzHub();
  if (qzView === 'game') { if (qzG?.status === 'playing' && !confirm('اگه بری از بازی حذف می‌شی. مطمئنی؟')) return; qzLeave(); }
}
function qzOpenHub() { $('qz').classList.remove('hidden'); gsEnsure(); if (qzG && qzView === 'game') qzRender(); else qzHub(); }
$('navGames').onclick = qzOpenHub;
/* ورود به بازی از پروفایل (cat همان حالت بازی است: classic یا knockout) */
function qzPlay(cat) { $('qz').classList.remove('hidden'); gsEnsure(); if (qzG && qzView === 'game') qzRender(); else if (QZ_MODES[cat]) qzSetup(cat); else qzHub(); }
function qzOpenBoard(cat) {
  if (qzG && qzView === 'game') { $('qz').classList.remove('hidden'); qzRender(); return toast('اول بازی فعلی را تمام کن'); }
  $('qz').classList.remove('hidden'); qzBoard(cat);
}
$('qzX').onclick = qzBack;
