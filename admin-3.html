<style>

<script type="module">
/* ====== اتصال به Supabase (همان بک‌اند بازی) ====== */
const SUPABASE_URL = 'https://pcvcaajarrlhfakdykah.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjdmNhYWphcnJsaGZha2R5a2FoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDI5NjcsImV4cCI6MjEwNzkxODk2N30.kkg60Cqq9BhhPBdw2KN9uqPf0uvsJY7I5kY25Q5DOAE';

function __makeShim(supa) {
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const autoId = () => { const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', a = new Uint8Array(20); crypto.getRandomValues(a); return Array.from(a, x => c[x % 62]).join(''); };
  const parentOf = p => p.replace(/\/[^/]+$/, '');

  /* ---------- خطاها ---------- */
  const fsErr = e => {
    if (e && e.__fs) return e;
    const msg = String(e?.message || e || ''), code = e?.code;
    let c = 'unknown';
    if (msg.includes('fs_conflict') || code === '40001' || code === '40P01') c = 'aborted';
    else if (msg.includes('fs_not_found') || code === 'P0002') c = 'not-found';
    else if (code === '42501' || /row-level security|permission denied|forbidden/i.test(msg)) c = 'permission-denied';
    else if (/fetch|network|timeout/i.test(msg) || e?.name === 'TypeError') c = 'unavailable';
    return Object.assign(new Error(msg || c), { code: c, __fs: true });
  };

  /* ---------- مقدارها ---------- */
  class Timestamp {
    constructor(ms) { this._ms = ms; }
    toMillis() { return this._ms; } toDate() { return new Date(this._ms); }
    get seconds() { return Math.floor(this._ms / 1000); } get nanoseconds() { return (this._ms % 1000) * 1e6; }
    valueOf() { return this._ms; }
    static now() { return new Timestamp(Date.now()); } static fromMillis(m) { return new Timestamp(m); } static fromDate(d) { return new Timestamp(d.getTime()); }
  }
  class Sentinel { constructor(j) { this.j = j; } }
  class FieldPath { constructor(...s) { this.s = s.map(String); } }
  const enc = v => {
    if (v === undefined) return undefined;
    if (v instanceof Sentinel) return v.j;
    if (v instanceof Timestamp) return { __t: v._ms };
    if (v instanceof Date) return { __t: v.getTime() };
    if (Array.isArray(v)) return v.map(x => { const y = enc(x); return y === undefined ? null : y; });
    if (v && typeof v === 'object') { const o = {}; for (const k of Object.keys(v)) { const x = enc(v[k]); if (x !== undefined) o[k] = x; } return o; }
    return v;
  };
  const dec = v => {
    if (Array.isArray(v)) return v.map(dec);
    if (v && typeof v === 'object') {
      if (typeof v.__t === 'number' && Object.keys(v).length === 1) return new Timestamp(v.__t);
      const o = {}; for (const k of Object.keys(v)) o[k] = dec(v[k]); return o;
    }
    return v;
  };
  const serverTimestamp = () => new Sentinel({ __op: 'ts' });
  const increment = n => new Sentinel({ __op: 'inc', n });
  const deleteField = () => new Sentinel({ __op: 'del' });
  const arrayUnion = (...v) => new Sentinel({ __op: 'union', v: v.map(enc) });
  const arrayRemove = (...v) => new Sentinel({ __op: 'rm', v: v.map(enc) });

  /* ---------- ارجاع‌ها و کوئری ---------- */
  class DocRef { constructor(path) { this.path = path; this.parent = parentOf(path); this.id = path.slice(path.lastIndexOf('/') + 1); this.type = 'document'; } }
  class ColRef { constructor(path) { this.path = path; this.id = path.slice(path.lastIndexOf('/') + 1); this.type = 'collection'; } }
  const collection = (_db, ...p) => new ColRef(p.join('/'));
  const doc = (base, ...p) => base instanceof ColRef ? new DocRef(base.path + '/' + (p.length ? p.join('/') : autoId())) : new DocRef(p.join('/'));
  const where = (f, op, v) => ({ t: 'where', f, op, v });
  const orderBy = (f, d = 'asc') => ({ t: 'order', f, d });
  const limitToLast = n => ({ t: 'last', n });
  const limit = n => ({ t: 'first', n });
  const query = (col, ...cons) => {
    const q = { isQuery: true, col, conds: [], order: null, desc: false, n: null, last: false };
    for (const c of cons) {
      if (c.t === 'where') q.conds.push(c);
      else if (c.t === 'order') { q.order = c.f; q.desc = c.d === 'desc'; }
      else if (c.t === 'last') { q.n = c.n; q.last = true; }
      else if (c.t === 'first') { q.n = c.n; q.last = false; }
    }
    return q;
  };
  const asQuery = x => x.isQuery ? x : query(x);
  const whereJson = q => {
    const o = {};
    for (const c of q.conds) {
      const v = enc(c.v);
      if (c.op === '==') o[c.f] = v; else if (c.op === 'array-contains') o[c.f] = [v];
      else throw fsErr(new Error('unsupported where operator: ' + c.op));
    }
    return o;
  };
  const jeq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const matches = (data, q) => q.conds.every(c => { const x = data?.[c.f], v = enc(c.v); return c.op === '==' ? jeq(x, v) : Array.isArray(x) && x.some(y => jeq(y, v)); });
  const skey = (d, f) => { const x = d?.[f]; return typeof x === 'number' ? x : (x && typeof x === 'object' && typeof x.__t === 'number') ? x.__t : null; };
  const cmpOf = q => (a, b) => {
    if (q.order) {
      const x = skey(a.data, q.order), y = skey(b.data, q.order);
      if (x !== y) { if (x === null) return q.desc ? -1 : 1; if (y === null) return q.desc ? 1 : -1; return q.desc ? y - x : x - y; }
    }
    return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
  };
  const viewOf = L => {
    let a = [...L.state.values()];
    if (!L.isDoc) { a.sort(cmpOf(L.q)); if (L.q.n != null) a = L.q.last ? a.slice(-L.q.n) : a.slice(0, L.q.n); }
    return a;
  };

  /* ---------- اسنپ‌شات‌ها ---------- */
  class DocSnap {
    constructor(path, data, exists, rev) { this.ref = new DocRef(path); this.id = this.ref.id; this._d = data; this._e = exists; this.rev = rev; this.metadata = { fromCache: false, hasPendingWrites: false }; }
    exists() { return this._e; }
    data() { return this._e ? dec(this._d) : undefined; }
    get(f) { return this.data()?.[f]; }
  }
  class QuerySnap {
    constructor(entries, changes) {
      this.docs = entries.map(e => new DocSnap(e.path, e.data, true, e.rev));
      this.size = this.docs.length; this.empty = !this.size;
      this._c = changes || this.docs.map((d, i) => ({ type: 'added', doc: d, oldIndex: -1, newIndex: i }));
      this.metadata = { fromCache: false, hasPendingWrites: false };
    }
    forEach(f, t) { this.docs.forEach(f, t); }
    docChanges() { return this._c; }
  }

  /* ---------- خواندن ---------- */
  async function fetchRow(path) {
    const { data, error } = await supa.from('docs').select('path,id,data,rev').eq('path', path).maybeSingle();
    if (error) throw fsErr(error);
    return data;
  }
  async function fetchQuery(q) {
    const { data, error } = await supa.rpc('fs_query', { p_parent: q.col.path, p_where: whereJson(q), p_order: q.order, p_desc: q.last ? !q.desc : q.desc, p_limit: q.n });
    if (error) throw fsErr(error);
    const rows = data || [];
    return q.last ? rows.slice().reverse() : rows;
  }
  const getDoc = async ref => { const r = await fetchRow(ref.path); return new DocSnap(ref.path, r?.data, !!r, r ? Number(r.rev) : 0); };
  const getDocs = async target => { const q = asQuery(target), rows = await fetchQuery(q); return new QuerySnap(rows.map(r => ({ path: r.path, id: r.id, data: r.data, rev: Number(r.rev) }))); };

  /* ---------- نوشتن ---------- */
  async function commit(ops, checks = []) {
    const { data, error } = await supa.rpc('fs_commit', { p_ops: ops, p_checks: checks });
    if (error) throw fsErr(error);
    (data || []).forEach(r => {
      if (r.deleted) dispatch({ path: r.path, parent: r.parent, id: r.id, deleted: true });
      else if (r.data) dispatch({ path: r.path, parent: r.parent, id: r.id, data: r.data, rev: Number(r.rev) });
    });
    return data;
  }
  const opSet = (ref, data, o) => ({ k: 'set', path: ref.path, data: enc(data), merge: !!(o && (o.merge || o.mergeFields)) });
  const toFields = args => {
    const out = [];
    if (args.length === 1 && args[0] && typeof args[0] === 'object' && !(args[0] instanceof FieldPath)) {
      for (const k of Object.keys(args[0])) { const v = enc(args[0][k]); if (v !== undefined) out.push({ p: k.split('.'), v }); }
    } else for (let i = 0; i < args.length; i += 2) {
      const v = enc(args[i + 1]); if (v !== undefined) out.push({ p: args[i] instanceof FieldPath ? args[i].s : String(args[i]).split('.'), v });
    }
    return out;
  };
  const opUpdate = (ref, args) => ({ k: 'update', path: ref.path, fields: toFields(args) });
  const opDelete = ref => ({ k: 'delete', path: ref.path });
  const setDoc = async (ref, data, o) => { await commit([opSet(ref, data, o)]); };
  const updateDoc = async (ref, ...args) => { await commit([opUpdate(ref, args)]); };
  const deleteDoc = async ref => { await commit([opDelete(ref)]); };
  const addDoc = async (col, data) => { const ref = new DocRef(col.path + '/' + autoId()); await commit([opSet(ref, data)]); return ref; };
  const writeBatch = () => {
    const ops = [];
    const b = {
      set(ref, d, o) { ops.push(opSet(ref, d, o)); return b; },
      update(ref, ...a) { ops.push(opUpdate(ref, a)); return b; },
      delete(ref) { ops.push(opDelete(ref)); return b; },
      commit: async () => { if (ops.length) await commit(ops.splice(0)); }
    };
    return b;
  };
  async function runTransaction(_db, fn) {
    for (let attempt = 0; ; attempt++) {
      const reads = new Map(), ops = [];
      const tx = {
        async get(ref) { const r = await fetchRow(ref.path); reads.set(ref.path, r ? Number(r.rev) : 0); return new DocSnap(ref.path, r?.data, !!r, r ? Number(r.rev) : 0); },
        set(ref, d, o) { ops.push(opSet(ref, d, o)); return tx; },
        update(ref, ...a) { ops.push(opUpdate(ref, a)); return tx; },
        delete(ref) { ops.push(opDelete(ref)); return tx; }
      };
      const result = await fn(tx);
      if (!ops.length) return result;
      const checks = [...reads].map(([path, rev]) => ({ path, rev })).sort((a, b) => a.path < b.path ? -1 : 1);
      try { await commit(ops, checks); return result; }
      catch (e) { if (e.code === 'aborted' && attempt < 6) { await sleep(60 * (attempt + 1) + Math.random() * 80); continue; } throw e; }
    }
  }

  /* ---------- ریل‌تایم ---------- */
  let chSeq = 0, delCh = null;
  const listeners = new Set();
  const rowEv = r => ({ path: r.path, parent: parentOf(r.path), id: r.id, data: r.data, rev: Number(r.rev) });
  const dispatch = ev => { for (const L of [...listeners]) handle(L, ev); };
  function ensureDelCh() {
    if (delCh) return;
    delCh = supa.channel('fs-del-' + (++chSeq)).on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'docs' }, p => {
      const path = p.old?.path; if (path) dispatch({ path, parent: parentOf(path), id: path.slice(path.lastIndexOf('/') + 1), deleted: true });
    }).subscribe();
  }
  function dropDelCh() { if (delCh && !listeners.size) { supa.removeChannel(delCh); delCh = null; } }
  function openChan(L) {
    const filter = L.isDoc ? 'path=eq.' + L.ref.path : 'parent=eq.' + L.q.col.path;
    let first = true;
    const h = p => {
      const r = p.new; if (!r || !r.path) return;
      if (p.errors || r.data === undefined) fetchRow(r.path).then(row => row && handle(L, rowEv(row))).catch(() => {});
      else handle(L, { path: r.path, parent: r.parent || parentOf(r.path), id: r.id, data: r.data, rev: Number(r.rev) });
    };
    L.ch = supa.channel('fs-' + (++chSeq))
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'docs', filter }, h)
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'docs', filter }, h)
      .subscribe(st => { if (st === 'SUBSCRIBED') { if (!first && !L.closed) resync(L); first = false; } });
  }
  function handle(L, ev) {
    if (!ev || L.closed) return;
    if (!L.ready) { L.buf.push(ev); return; }
    if (L.isDoc ? ev.path !== L.ref.path : ev.parent !== L.q.col.path) return;
    if (ev.deleted) { if (!L.state.delete(ev.path)) return; }
    else {
      const cur = L.state.get(ev.path);
      if (cur && cur.rev >= ev.rev) return;
      if (ev.data == null) { fetchRow(ev.path).then(row => row && handle(L, rowEv(row))).catch(() => {}); return; }
      if (L.isDoc || matches(ev.data, L.q)) L.state.set(ev.path, { path: ev.path, id: ev.id, data: ev.data, rev: ev.rev });
      else if (!L.state.delete(ev.path)) return;
    }
    schedule(L);
  }
  const schedule = L => { if (L.tm) return; L.tm = setTimeout(() => { L.tm = null; emit(L); }, 0); };
  function emit(L) {
    if (L.closed || !L.ready) return;
    const view = viewOf(L), next = new Map(), changes = [];
    view.forEach((e, i) => {
      next.set(e.path, e); const o = L.out.get(e.path);

/* ====== داده‌ها (زنده) ====== */
const S = { mlog: [], users: {}, rooms: {}, market: [], reports: [], sugg: [], quests: [], bot: { on: true, filter: true, autoMute: true, welcome: true, words: [], replies: [] }, ready: {} };
let warned = false;
const fail = e => { console.error(e); if (!warned) { warned = true; toast('خواندن داده ناموفق بود؛ سیاست‌های دسترسی (RLS) دیتابیس Supabase را اجرا کرده‌ای؟'); } };
function listen() {
  const L = [], mark = k => { S.ready[k] = true; render(); };
  L.push(onSnapshot(collection(db, 'users'), sn => { S.users = {}; sn.forEach(d => { S.users[d.id] = { uid: d.id, ...d.data() }; }); mark('users'); }, fail));
  L.push(onSnapshot(query(collection(db, 'rooms'), where('type', '==', 'group')), sn => { S.rooms = {}; sn.forEach(d => { S.rooms[d.id] = { id: d.id, ...d.data() }; }); mark('rooms'); }, fail));
  L.push(onSnapshot(collection(db, 'market'), sn => { S.market = sn.docs.map(d => ({ id: d.id, ...d.data() })); mark('market'); }, fail));
  L.push(onSnapshot(collection(db, 'reports'), sn => { S.reports = sn.docs.map(d => ({ id: d.id, ...d.data() })); mark('reports'); }, fail));
  L.push(onSnapshot(collection(db, 'suggestions'), sn => { S.sugg = sn.docs.map(d => ({ id: d.id, ...d.data() })); mark('sugg'); }, fail));
  L.push(onSnapshot(collection(db, 'questions'), sn => { S.quests = sn.docs.map(d => ({ id: d.id, ...d.data() })); mark('quests'); }, fail));
  L.push(onSnapshot(doc(db, 'settings', 'bot'), sn => { S.bot = { on: true, filter: true, autoMute: true, welcome: true, words: [], replies: [], ...(sn.exists() ? sn.data() : {}) }; mark('bot'); }, fail));
  loadModLog();
  const ch = supa.channel('modlog-' + Date.now()).on('postgres_changes', { event: '*', schema: 'public', table: 'mod_log' }, () => loadModLog()).subscribe(), iv = setInterval(loadModLog, 30000);
  L.push(() => { clearInterval(iv); try { supa.removeChannel(ch); } catch (e) { /* بی‌صدا */ } });
  return () => L.forEach(f => f());
}
async function loadModLog() {
  try {
    const { data, error } = await supa.from('mod_log').select('*').order('at', { ascending: false }).limit(200);
    if (error) throw error; S.mlog = data || []; S.ready.mlog = true; render();
  } catch (e) { if (!S.ready.mlogErr) { S.ready.mlogErr = true; toast('گزارش ناظرها خوانده نشد؛ فایل mod-update.sql رو اجرا کردی؟'); } }
}

function giftGrid(uid) {
  const u = S.users[uid], inv = u.inventory || [];
  $('uSub').innerHTML = `<h3 class="sec">🎁 کارت (روی کارت ✓دار بزنی برداشته می‌شود)</h3><div class="gg">${ITEMS.map(i => `<button data-g="${i.id}" class="${inv.includes(i.id) ? 'own' : ''}" style="border-color:${inv.includes(i.id) ? '' : RAR[i.r].c + '66'}"><span>${i.e}</span>${esc(i.n)}</button>`).join('')}</div>`;
  $('uSub').onclick = guard(async e => {
    const b = e.target.closest('[data-g]'); if (!b) return; const id = +b.dataset.g, has = (S.users[uid].inventory || []).includes(id), it = ITEMS.find(x => x.id === id);
    if (has) { if (!confirm('این کارت از کاربر برداشته شود؟')) return; const ch = (S.users[uid].charms || []).filter(c => c !== it.e); await updateDoc(doc(db, 'users', uid), { inventory: arrayRemove(id), ['invMeta.' + id]: deleteField(), charms: ch }); toast('کارت برداشته شد'); }
    else { await giveItem(uid, id); toast(`🎁 ${it.n} داده شد`); }
    setTimeout(() => giftGrid(uid), 500);
  });
}
async function giveItem(uid, id) {
  await runTransaction(db, async tx => {
    const uref = doc(db, 'users', uid), sref = doc(db, 'stats', 'issued'), u = (await tx.get(uref)).data(), st = (await tx.get(sref)).data() || {};
    if ((u.inventory || []).includes(id)) throw new Error('own');
    const n = (st['i' + id] || 0) + 1;
    tx.set(sref, { ['i' + id]: n }, { merge: true });
    tx.update(uref, { inventory: arrayUnion(id), ['invMeta.' + id]: { n, bd: BACKDROPS[Math.floor(Math.random() * BACKDROPS.length)].k, sy: Math.floor(Math.random() * SYMBOLS.length), p: 0, how: 'gift', at: Date.now() } });
  });
}

async function nukeRoom(rid, handle) {
  for (;;) {
    const sn = await getDocs(query(collection(db, 'rooms', rid, 'msgs'), limit(400))); if (sn.empty) break;
    const b = writeBatch(db); sn.docs.forEach(d => b.delete(d.ref)); await b.commit();
  }
  await deleteDoc(doc(db, 'rooms', rid));
  if (handle) await deleteDoc(doc(db, 'clanIds', handle)).catch(() => {});
}

/* ====== معامله‌ها (گروه ۳ نفره‌ی نظارت) ====== */
async function revertDeal(lid) {
  await runTransaction(db, async tx => {
    const lref = doc(db, 'market', lid), l = (await tx.get(lref)).data();
    if (!l || l.status !== 'sold') throw new Error('این معامله قابل لغو نیست');
    const bref = doc(db, 'users', l.buyer), sref = doc(db, 'users', l.seller), b = (await tx.get(bref)).data();
    if (!(b.inventory || []).includes(l.card)) throw new Error('خریدار دیگر این کارت را ندارد');
    const it = ITEMS.find(i => i.id === l.card);
    tx.update(lref, { status: 'reverted', paid: true });

let GALL = null, gallBusy = false;
async function gallLoad() {
  if (gallBusy) return; gallBusy = true;
  try { const { data, error } = await supa.rpc('dg_admin_list', { p_limit: 80 }); if (error) throw error; GALL = data || []; }
  catch (e) { GALL = []; toast('خواندن نقاشی‌ها نشد: ' + (e.message || '')); }

const GCOL = ['#1d1d1f', '#e5484d', '#f08c00', '#f2c230', '#2fb344', '#1c7ed6', '#7048e8', '#d6336c', '#8d5a2b', '#8e8e93'], GW = [5, 10, 17, 30];
function gallPaint(cv, strokes) {
  const ctx = cv.getContext('2d'), k = cv.width / 1000; let last = null;
  (strokes || []).forEach(op => {
    if (op.t === 'x') { ctx.clearRect(0, 0, cv.width, cv.height); last = null; return; }
    const p = op.p || []; if (p.length < 2) return;
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = (GW[op.w] || 10) * k;
    if (op.c === 10) ctx.globalCompositeOperation = 'destination-out'; else ctx.strokeStyle = GCOL[op.c] || '#1d1d1f';
    ctx.beginPath(); let i = 0;
    if (op.n || !last) { ctx.moveTo(p[0] * k, p[1] * k); i = 2; if (p.length === 2) ctx.lineTo(p[0] * k + .01, p[1] * k); } else ctx.moveTo(last[0] * k, last[1] * k);
    for (; i < p.length; i += 2) ctx.lineTo(p[i] * k, p[i + 1] * k);
    ctx.stroke(); ctx.restore(); last = [p[p.length - 2], p[p.length - 1]];
  });
}
function gallView(v) {
  if (GALL === null) { v.innerHTML = '<p class="empty" style="padding:30px;text-align:center">در حال بارگذاری نقاشی‌ها…</p>'; gallLoad(); return; }

  if ((b = q('[data-end]'))) { if (!confirm('گروه معامله با همه‌ی پیام‌هایش حذف شود؟')) return; await nukeRoom(b.dataset.end); toast('گروه معامله حذف شد'); return; }
  if ((b = q('[data-rchat]'))) { const r = rep(b.dataset.rchat); return r && chatModal(r.room, r.roomName || 'گفتگو', r.msgId); }
  if ((b = q('[data-rdel]'))) { const r = rep(b.dataset.rdel); if (r && confirm('پیام گزارش‌شده حذف شود؟')) { await delMsg(r.room, r.msgId); await updateDoc(doc(db, 'reports', r.id), { status: 'done' }); } return; }
  if ((b = q('[data-rmute]'))) { const r = rep(b.dataset.rmute); if (r) { await updateDoc(doc(db, 'users', r.target), { mutedUntil: Date.now() + 86400000, warns: 0 }); await updateDoc(doc(db, 'reports', r.id), { status: 'done' }); toast('🔇 ساکت شد'); } return; }
  if ((b = q('[data-rban]'))) { const r = rep(b.dataset.rban); if (r && confirm(`${r.targetName} مسدود شود؟`)) { await updateDoc(doc(db, 'users', r.target), { banned: true }); await updateDoc(doc(db, 'reports', r.id), { status: 'done' }); toast('🚫 مسدود شد'); } return; }
  if ((b = q('[data-rok]'))) { await updateDoc(doc(db, 'reports', b.dataset.rok), { status: 'done' }); return; }
  if ((b = q('[data-rrm]'))) { await deleteDoc(doc(db, 'reports', b.dataset.rrm)); return; }
  if (q('#qAdd')) {
    const x = { cat: $('qCat').value, ask: $('qAsk').value.trim(), clue: $('qClue').value.trim(), big: $('qBig').value.trim(), answer: $('qAns').value.trim() };
    if (!x.ask || !x.answer) return toast('پرسش و پاسخ را بنویس');
    await addDoc(collection(db, 'questions'), { ...x, at: serverTimestamp() }); toast('✅ سوال اضافه شد'); return;
  }
  if ((b = q('[data-qd]'))) { if (confirm('این سوال حذف شود؟')) await deleteDoc(doc(db, 'questions', b.dataset.qd)); return; }
  if ((b = q('[data-gtog]'))) { const { error } = await supa.rpc('dg_admin_set', { p_id: b.dataset.gtog, p_status: b.dataset.st }); if (error) return toast('انجام نشد'); GALL = null; draw(); return; }
  if ((b = q('[data-gdel]'))) { if (!confirm('این نقاشی برای همیشه حذف شود؟')) return; const { error } = await supa.rpc('dg_admin_delete', { p_id: b.dataset.gdel }); if (error) return toast('حذف نشد'); GALL = null; draw(); return; }
  if (q('[data-gref]')) { GALL = null; draw(); return; }
  if ((b = q('[data-sdone]'))) { await updateDoc(doc(db, 'suggestions', b.dataset.sdone), { status: 'done' }); return; }
  if ((b = q('[data-sdel]'))) { await deleteDoc(doc(db, 'suggestions', b.dataset.sdel)); return; }
  if ((b = q('[data-pa]'))) { const u = S.users[b.dataset.pa]; await updateDoc(doc(db, 'users', u.uid), { photo: u.photoPending, photoPending: '' }); toast('عکس تایید شد ✅'); return; }
  if ((b = q('[data-pr]'))) { await updateDoc(doc(db, 'users', b.dataset.pr), { photoPending: '', photoRejected: Date.now() }); toast('عکس رد شد'); return; }
  if ((b = q('[data-tg]'))) return saveBot({ [b.dataset.tg]: S.bot[b.dataset.tg] === false });
  if ((b = q('[data-delw]'))) return saveBot({ words: (S.bot.words || []).filter((_, i) => i !== +b.dataset.delw) });
  if ((b = q('[data-delr]'))) return saveBot({ replies: (S.bot.replies || []).filter((_, i) => i !== +b.dataset.delr) });
  if (q('[data-addw]')) { const w = $('botW').value.trim(); if (w) await saveBot({ words: [...(S.bot.words || []), w].slice(0, 100) }); return; }
  if (q('[data-addr]')) { const k = $('botK').value.trim(), v = $('botV').value.trim(); if (k && v) await saveBot({ replies: [...(S.bot.replies || []), { k, v }].slice(0, 50) }); else toast('هر دو کادر را پر کن'); return; }
  if (q('#chPost')) { const x = $('chTxt').value.trim(); if (!x) return; $('chPost').disabled = true; await postChannel(x); toast('📣 ارسال شد'); $('chTxt').value = ''; $('chPost').disabled = false; return; }
  if ((b = q('[data-chd]'))) { if (confirm('این پیام از کانال حذف شود؟')) await delMsg('channel', b.dataset.chd); return; }
}));
</script>
</body>
</html>
